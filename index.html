  /* ════ 미궁의 사냥꾼 UI — "던전 벽에서 깎아 낸 돌판" (design/ui.md) ════ */
  :root {
    --abyss:#100d17; --stone:#26212f; --lit:#4d4559; --shade:#0b0910; --deep:#17131e;
    --bone:#eadfc2; --dim:#9a8f7c; --torch:#f2c46a; --blood:#d84a40; --rune:#8fc6ff; --moss:#8ce8b0;
    /* 2px 계단으로 깎은 모서리 */
    --notch: polygon(2px 0,calc(100% - 2px) 0,100% 2px,100% calc(100% - 2px),calc(100% - 2px) 100%,2px 100%,0 calc(100% - 2px),0 2px);
    --notch4: polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 2px,calc(100% - 2px) 2px,calc(100% - 2px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 2px) calc(100% - 4px),calc(100% - 2px) calc(100% - 2px),calc(100% - 4px) calc(100% - 2px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 2px),2px calc(100% - 2px),2px calc(100% - 4px),0 calc(100% - 4px),0 4px,2px 4px,2px 2px,4px 2px);
    /* 계단 팔각형 (룬석 버튼·조이스틱) */
    --oct: polygon(30% 0,70% 0,70% 6%,85% 6%,85% 15%,94% 15%,94% 30%,100% 30%,100% 70%,94% 70%,94% 85%,85% 85%,85% 94%,70% 94%,70% 100%,30% 100%,30% 94%,15% 94%,15% 85%,6% 85%,6% 70%,0 70%,0 30%,6% 30%,6% 15%,15% 15%,15% 6%,30% 6%);
    --ink: 2px 0 0 var(--shade),-2px 0 0 var(--shade),0 2px 0 var(--shade),0 -2px 0 var(--shade),2px 2px 0 var(--shade);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; background:var(--abyss); color:var(--bone);
    font-family:'Galmuri11',sans-serif; font-size:12px; line-height:1.5; font-synthesis:none;
    -webkit-font-smoothing:none; overflow:hidden; overscroll-behavior:none; touch-action:manipulation; }
  b, strong { font-weight:700; }
  #wrap { max-width:620px; margin:0 auto; padding:6px; }
  #stage { position:relative; width:100%; }
  canvas#game { width:100%; display:block; image-rendering:pixelated; image-rendering:-moz-crisp-edges;
    background:var(--abyss); clip-path:var(--notch4); }
  .hide { display:none !important; }
  :focus-visible { outline:2px solid var(--torch); outline-offset:2px; }

  /* ── 돌판: 2px 그늘 윤곽 + 안쪽 깎인 면(위·왼쪽 밝음 / 아래·오른쪽 그늘) ── */
  .btn, #restartBtn, #muteBtn, #fsBtn, #introSkip, #toast, .lb, .nameRow input, #keyHint kbd, .stats {
    background:var(--stone); border:2px solid var(--shade); border-radius:0;
    box-shadow:inset 2px 2px 0 var(--lit), inset -2px -2px 0 var(--deep); clip-path:var(--notch); }

  /* ── 게임 화면 위 글자 ── */
  .ov { position:absolute; pointer-events:none; text-shadow:var(--ink); }
  #obj { left:8px; top:6px; font-weight:700; font-size:12px; color:var(--torch); }
  #toast { left:50%; transform:translateX(-50%); bottom:44px; max-width:92%; width:max-content;
    padding:5px 12px 4px; text-align:center; font-weight:700; color:var(--bone); text-shadow:2px 2px 0 var(--shade);
    opacity:0; transition:opacity .25s steps(3); }
  #toast.tip { border-color:var(--torch); box-shadow:inset 2px 2px 0 #7a6230, inset -2px -2px 0 #3a2c12;
    background:#2e2412; color:#ffe6a0; padding-left:26px; }
  #toast.tip::before { content:'!'; position:absolute; left:8px; top:4px; width:12px; height:14px; line-height:14px;
    background:var(--torch); color:var(--shade); text-align:center; text-shadow:none; }

  /* ── 상태줄 ── */
  #statusbar { display:flex; align-items:center; justify-content:space-between; padding:6px 2px 0;
    font-weight:700; color:var(--bone); font-variant-numeric:tabular-nums; }
  #statusbar .sp { width:84px; display:flex; gap:4px; }
  #statusbar .sp > div { width:38px !important; }
  #clock { font-size:24px; line-height:24px; color:var(--torch); text-shadow:2px 2px 0 var(--shade); min-height:24px; }
  #restartBtn, #muteBtn, #fsBtn { height:30px; padding:0; text-align:center; user-select:none; cursor:pointer;
    color:var(--bone); font-weight:700; font-size:12px; line-height:26px; position:relative; }
  #restartBtn { width:78px; padding-left:16px; }
  #muteBtn, #fsBtn { font-size:0; }
  #restartBtn::before, #muteBtn::before, #fsBtn::before { content:''; position:absolute; top:5px; width:16px; height:16px;
    background-color:currentColor; -webkit-mask:var(--ico) center/16px 16px no-repeat; mask:var(--ico) center/16px 16px no-repeat; }
  #muteBtn::before, #fsBtn::before { left:50%; margin-left:-8px; }
  #restartBtn::before { left:8px; --ico:var(--ico-restart); }
  #muteBtn::before { --ico:var(--ico-sound); }
  #muteBtn.off::before { --ico:var(--ico-mute); }
  #muteBtn.off { color:var(--dim); }
  #fsBtn::before { --ico:var(--ico-full); }
  #fsBtn.on::before { --ico:var(--ico-unfull); }
  #restartBtn.arm { background:#4a1c1a; border-color:var(--shade); box-shadow:inset 2px 2px 0 #8a3a32, inset -2px -2px 0 #2a0e0c; color:#ffd8d0; }
  #restartBtn:active, #muteBtn:active, #fsBtn:active { box-shadow:inset -2px -2px 0 var(--lit), inset 2px 2px 0 var(--deep); }

  /* ── 터치 조작 ── */
  #pads { position:relative; height:190px; margin-top:6px; user-select:none; -webkit-user-select:none; touch-action:none; }
  #joy { position:absolute; left:4px; bottom:6px; width:160px; height:160px; touch-action:none; }
  /* 조이스틱 받침: 바닥에 파인 팔각 홈 */
  #joyRing { position:absolute; left:14px; top:14px; width:132px; height:132px; background:var(--shade); clip-path:var(--oct); }
  #joyRing::after { content:''; position:absolute; inset:3px; clip-path:var(--oct); background:#2b2535;
    box-shadow:inset 5px 5px 0 #0e0b14, inset -4px -4px 0 #5a5168; }
  #joyRing::before { content:''; position:absolute; inset:28%; z-index:1; clip-path:var(--oct); background:#1a1621; }
  #joyRing.run { background:var(--torch); }
  /* 손잡이: 청동 원반 */
  #knob { position:absolute; left:52px; top:52px; width:56px; height:56px; z-index:2; background:var(--shade); clip-path:var(--oct);
    transition:transform .06s; }
  #knob::after { content:''; position:absolute; inset:3px; clip-path:var(--oct); background:#7a6440;
    box-shadow:inset 4px 4px 0 #c9a868, inset -4px -4px 0 #45361f; }
  #joyHint { position:absolute; left:0; right:0; bottom:-2px; text-align:center; font-family:'Galmuri9',sans-serif; font-size:10px; color:var(--dim); pointer-events:none; }

  /* 행동 버튼: 계단 팔각 룬석 */
  #acts { position:absolute; right:2px; bottom:6px; width:206px; height:180px; }
  .abtn { position:absolute; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--bone);
    cursor:pointer; touch-action:none; transition:opacity .15s; background:none; border:0; border-radius:0; }
  .abtn::before { content:''; position:absolute; inset:0; background:var(--shade); clip-path:var(--oct); }
  .abtn::after { content:''; position:absolute; inset:3px; background:var(--stone); clip-path:var(--oct);
    box-shadow:inset 3px 3px 0 var(--lit), inset -3px -3px 0 var(--deep); }
  .abtn img, .abtn b { position:relative; z-index:1; }
  .abtn img { width:26px; height:26px; image-rendering:pixelated; object-fit:contain; pointer-events:none; }
  .abtn b { font-weight:700; font-size:12px; line-height:1.1; pointer-events:none; text-shadow:2px 2px 0 var(--shade); }
  .abtn i { position:absolute; z-index:2; right:-2px; top:-2px; min-width:20px; height:20px; padding:0 3px;
    background:var(--torch); color:var(--shade); border:2px solid var(--shade); font-style:normal; font-weight:700;
    font-size:12px; line-height:16px; text-align:center; pointer-events:none; }
  .abtn.on::after { background:#3a2f1a; box-shadow:inset -3px -3px 0 var(--lit), inset 3px 3px 0 var(--deep); }
  .abtn.on img, .abtn.on b { transform:translateY(2px); }
  .abtn.off { opacity:.38; }
  .abtn.off i { background:var(--dim); }
  .a-use   { right:0; bottom:0; width:92px; height:92px; }
  .a-use img { width:34px; height:34px; }
  .a-use b { font-size:12px; }
  .a-use.ready::before { background:var(--torch); animation:runePulse 1.2s steps(2) infinite; }
  @keyframes runePulse { 50% { background:#8a6a2a; } }
  .a-fire  { right:100px; bottom:4px;  width:62px; height:62px; }
  .a-fire:not(.off)::after { box-shadow:inset 3px 3px 0 #4f6f96, inset -3px -3px 0 var(--deep); }
  .a-plank { right:84px;  bottom:84px; width:62px; height:62px; }
  .a-bait  { right:12px;  bottom:104px; width:62px; height:62px; }
  #hint { text-align:center; font-family:'Galmuri9',sans-serif; font-size:10px; color:var(--dim); margin-top:2px; line-height:1.5; }

  /* ── 제목 · 결과 화면 ── */
  #screen { position:absolute; inset:0; background:var(--abyss); clip-path:var(--notch4);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:16px; }
  #screen .titleArt { position:absolute; inset:0 0 34% 0; background-size:cover; background-position:center 58%; image-rendering:pixelated; }
  #screen .titleArt::after { content:''; position:absolute; inset:0;
    background:linear-gradient(to bottom, rgba(16,13,23,0) 55%, var(--abyss)); }
  #screen .titlePanel { position:absolute; left:0; right:0; bottom:0; top:62%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; background:var(--abyss); }
  #screen .titlePanel p { margin:2px 0 0; }
  #screen .titlePanel .go { margin-top:10px; }
  #screen h1 { margin:0 0 4px; font-family:'Galmuri14',sans-serif; font-weight:400; font-size:45px; line-height:1.1;
    color:var(--torch); text-shadow:3px 0 0 var(--shade),-3px 0 0 var(--shade),0 -3px 0 var(--shade),0 3px 0 #7a2a16,0 6px 0 var(--shade); }
  #screen h2 { margin:0 0 6px; font-family:'Galmuri14',sans-serif; font-weight:400; font-size:30px; line-height:1.2; text-shadow:var(--ink),0 4px 0 var(--shade); }
  #screen p { margin:4px 0; color:var(--bone); line-height:1.5; }
  #screen p.sub { color:var(--dim); }
  .btn { color:var(--bone); font-weight:700; font-size:12px; display:inline-flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none; text-shadow:2px 2px 0 var(--shade); }
  .btn:active { box-shadow:inset -2px -2px 0 var(--lit), inset 2px 2px 0 var(--deep); }
  .btn.wait { opacity:.5; pointer-events:none; }
  #screen .go { margin-top:14px; padding:10px 26px 8px 36px; font-size:24px; line-height:1; pointer-events:auto; position:relative;
    border-color:var(--shade); background:#3a2f1a; box-shadow:inset 2px 2px 0 #a8873f, inset -2px -2px 0 #1e170a; color:#ffe6a0; }
  #screen .go::before { content:'▶'; position:absolute; left:12px; top:11px; font-size:12px; color:var(--torch); animation:cursor 1s steps(1) infinite; }
  @keyframes cursor { 50% { opacity:0; } }
  .rcol { display:flex; flex-direction:column; align-items:center; }
  .wide #screen.res { flex-direction:row; align-items:center; justify-content:center; gap:40px; padding-top:40px; }
  .wide #screen.res .rcol { zoom:var(--z,1); }
  #homeBtn { margin-top:8px; padding:7px 16px 6px; pointer-events:auto; }
  #bestLine { margin-top:6px !important; color:var(--torch) !important; min-height:1.5em; }
  .keyTip { color:var(--dim) !important; font-family:'Galmuri9',sans-serif; font-size:10px; margin-top:6px !important; }
  /* 결과: 판 기록 (게임 스프라이트 아이콘) */
  .stats { display:flex; flex-direction:column; gap:1px; min-width:210px; margin:8px 0 2px; padding:7px 12px 5px; color:var(--dim); }
  .stats div { display:flex; align-items:center; gap:6px; justify-content:flex-start; }
  .stats img { width:16px; height:16px; object-fit:contain; image-rendering:pixelated; }
  .stats b { color:var(--bone); margin-left:auto; padding-left:8px; }
  .lb { margin-top:8px; min-width:210px; padding:6px 6px 4px; }
  .lbT { color:var(--torch); font-weight:700; margin-bottom:2px; }
  .lbR { display:flex; gap:10px; padding:1px 8px; color:var(--bone); }
  .lbR span { width:14px; color:var(--dim); text-align:right; } .lbR b { flex:1; text-align:left; } .lbR em { font-style:normal; color:var(--dim); }
  .lbR.me { background:var(--torch); color:var(--shade); } .lbR.me span, .lbR.me em { color:var(--shade); }
  .nameRow { display:flex; gap:6px; margin-top:8px; align-items:center; justify-content:center; }
  .nameRow input { width:84px; height:34px; padding:4px 8px; font:700 24px/1 'Galmuri11',sans-serif; text-align:center; color:#ffe6a0;
    background:var(--deep); box-shadow:inset 2px 2px 0 #060509, inset -2px -2px 0 var(--lit); caret-color:var(--torch); }
  .nameRow input::placeholder { color:#5b5366; }
  .nameRow .btn { padding:9px 14px 8px; }
  .newRec { color:var(--torch); font-weight:700; margin-top:4px; animation:cursor 1s steps(1) infinite; }

  /* ── 단계 안내 배너: 양 끝을 계단으로 자른 띠 ── */
  #banner { position:absolute; left:0; right:0; top:34%; text-align:center; pointer-events:none; opacity:0;
    display:flex; flex-direction:column; align-items:center; gap:0; text-shadow:none; }
  #banner b { font-family:'Galmuri14',sans-serif; font-weight:400; font-size:30px; line-height:1.2; color:var(--torch);
    text-shadow:var(--ink),0 4px 0 var(--shade); padding:6px 34px 4px; background:var(--shade);
    clip-path:polygon(0 30%,8px 30%,8px 15%,16px 15%,16px 0,calc(100% - 16px) 0,calc(100% - 16px) 15%,calc(100% - 8px) 15%,calc(100% - 8px) 30%,100% 30%,100% 70%,calc(100% - 8px) 70%,calc(100% - 8px) 85%,calc(100% - 16px) 85%,calc(100% - 16px) 100%,16px 100%,16px 85%,8px 85%,8px 70%,0 70%); }
  #banner span { margin-top:4px; padding:2px 10px; background:var(--shade); color:var(--bone); }
  #banner.show { animation:bannerIn 2.2s steps(1,end) forwards; }
  @keyframes bannerIn { 0%{opacity:0} 4%{opacity:.5} 8%{opacity:1} 80%{opacity:1} 88%{opacity:.5} 96%,100%{opacity:0} }

  /* ── 도입 장면: 옛 게임 대사창 ── */
  #intro { position:absolute; inset:0; overflow:hidden; background:var(--abyss) center 58%/cover; clip-path:var(--notch4);
    display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:5; cursor:pointer; image-rendering:pixelated; }
  #intro::before { content:''; position:absolute; inset:0; background:rgba(16,13,23,.86); }
  #intro > * { position:relative; }
  #intro.quake { animation:quake .6s steps(6); }
  @keyframes quake { 0%,100%{transform:none} 20%{transform:translate(-4px,2px)} 40%{transform:translate(4px,-2px)} 60%{transform:translate(-2px,-2px)} 80%{transform:translate(2px,2px)} }
  #introImg { height:84px; image-rendering:pixelated; opacity:0; transition:opacity .4s steps(4); filter:drop-shadow(0 4px 0 var(--shade)); }
  #introImg.dark { filter:brightness(.16) drop-shadow(0 0 0 #000); }
  #introImg.show { opacity:1; }
  #introLine { margin-top:14px; min-height:84px; width:min(92%, 420px); padding:12px 16px 10px; font-size:24px; line-height:1.5;
    color:var(--bone); text-align:center; white-space:pre-line; text-shadow:2px 2px 0 var(--shade);
    background:var(--stone); border:2px solid var(--shade); box-shadow:inset 2px 2px 0 var(--lit), inset -2px -2px 0 var(--deep);
    clip-path:var(--notch); opacity:0; }
  #introLine.gold { color:var(--torch); }
  #introLine.show { opacity:1; }
  #introLine.typing::after { content:'▌'; color:var(--torch); }
  #introDots { position:absolute; bottom:12px; font-family:'Galmuri9',sans-serif; font-size:10px; letter-spacing:2px; color:var(--dim); }
  #introSkip { position:absolute; top:10px; right:10px; padding:5px 10px 4px; font-weight:700; color:var(--bone); }
  #introTap { position:absolute; bottom:30px; font-family:'Galmuri9',sans-serif; font-size:10px; color:var(--dim); animation:cursor 1.2s steps(1) infinite; }
  @keyframes blink { 50%{opacity:.3} }

  /* ── 노트북(가로 화면) 배치 ── */
  #keyHint { display:none; }
  body.wide { background:#000; }
  .wide #wrap { max-width:none; padding:0; height:100vh; display:flex; align-items:center; justify-content:center; position:relative; }
  .wide #stage { width:auto; }
  .wide canvas#game, .wide #screen, .wide #intro { clip-path:none; }
  .wide #pads, .wide #hint { display:none; }
  .wide #statusbar { position:absolute; top:6px; left:50%; transform:translateX(-50%); zoom:var(--z,1); gap:8px; padding:3px 6px; z-index:6; }
  .wide #statusbar .sp { width:auto; display:flex; gap:6px; }
  .wide #statusbar #clock { min-width:96px; text-align:center; }
  .wide #obj, .wide #toast, .wide #banner, .wide #keyHint { zoom:var(--z,1); }
  .wide #toast { bottom:40px; }
  .wide #keyHint { display:block; position:absolute; left:50%; transform:translateX(-50%); bottom:5px; white-space:nowrap;
    font-family:'Galmuri9',sans-serif; font-size:10px; color:var(--bone); pointer-events:none; text-shadow:var(--ink); }
  #keyHint kbd { font:inherit; color:var(--torch); padding:0 4px; margin:0 2px 0 6px; text-shadow:none; display:inline-block; line-height:14px; }
  .wide #screen > h2, .wide #screen > p, .wide #screen > div:not(.titleArt):not(.titlePanel),
  .wide #screen .titlePanel > *, .wide #intro > * { zoom:var(--z,1); }
  .wide #screen .titleArt { inset:0 0 22% 0; background-position:center 45%; }
  .wide #screen .titleArt::after { background:linear-gradient(to bottom, rgba(16,13,23,0) 62%, var(--abyss)); }
  .wide #screen .titlePanel { top:58%; background:transparent; justify-content:flex-start; padding-top:0; }
  .wide #screen h1 { font-size:30px; text-shadow:2px 0 0 var(--shade),-2px 0 0 var(--shade),0 -2px 0 var(--shade),0 2px 0 #7a2a16,0 4px 0 var(--shade); }
  .wide #screen .titlePanel .go { margin-top:6px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="352" height="256"></canvas>
    <div class="ov" id="obj"></div>
    <div class="ov" id="toast"></div>
    <div class="ov" id="banner"></div>
    <div id="keyHint"><kbd>WASD</kbd>이동 <kbd>Shift</kbd>달리기 <kbd>E</kbd>구출·상자 <kbd>F</kbd>석궁 <kbd>Space</kbd>목재 <kbd>Q</kbd>미끼</div>
    <div id="screen">
      <div class="titleArt"></div>
      <div class="titlePanel">
      <h1>미궁의 사냥꾼</h1>
      <p class="sub">괴물의 미로에서 공주를 구하고 탈출하라</p>
      <div class="btn go wait" id="startBtn">불러오는 중…</div>
      <p id="bestLine"></p>
      <p class="keyTip" id="keyTip"></p>
      </div>
    </div>
    <div id="intro" class="hide"><img id="introImg" alt=""><div id="introLine"></div><div id="introTap">화면을 누르면 넘어갑니다</div><div id="introDots"></div><div id="introSkip">건너뛰기 ▶</div></div>
  </div>
  <div id="statusbar"><span class="sp"><div id="muteBtn" role="button" aria-label="소리 끄기"></div><div id="fsBtn" role="button" aria-label="전체화면"></div></span><span id="clock">0.00초</span><div id="restartBtn">재시작</div></div>

  <div id="pads">
    <div id="joy"><div id="joyRing"></div><div id="knob"></div><div id="joyHint">끌어서 이동 · 끝까지 밀면 달리기</div></div>
    <div id="acts">
      <div class="abtn a-bait"  data-k="bait"><img data-icon="meat"><b>미끼</b><i id="cBait">1</i></div>
      <div class="abtn a-plank" data-k="plank"><img data-icon="plank_item"><b>목재</b><i id="cPlank">1</i></div>
      <div class="abtn a-fire off" data-k="fire"><img data-icon="crossbow"><b>석궁</b><i id="cFire">0</i></div>
      <div class="abtn a-use off" data-k="use"><img data-icon="chest" id="useIcon"><b id="useLbl">상호작용</b></div>
    </div>
  </div>
  <div id="hint">PC: WASD 이동 · Shift 달리기 · E 상호작용 · F 석궁 · Space 목재(등 뒤) · Q 미끼 · R 재시작</div>
</div>

const IMG={};
let assetsReady=false;
(function(){
  const keys=Object.keys(IMG_SRC); let n=0;
  for(const k of keys){
    const im=new Image();
    im.onload=()=>{ if(++n===keys.length){ assetsReady=true; onAssetsReady(); } };
    im.src=IMG_SRC[k]; IMG[k]=im;
  }
})();
const _btn={};
function setBtn(id,text,on,cls){
  const el=document.getElementById(id); if(!el||!el.classList) return;
  const key=text+'|'+on;
  if(_btn[id]===key) return; _btn[id]=key;
  if(text!==null) el.textContent=text;
  const host=cls?el.closest('.abtn'):el.parentElement;
  if(host&&host.classList) host.classList.toggle('off',!on);
}
function updateButtons(){
  if(!player||!playing()) return;
  setBtn('cFire', String(player.ammo), player.bow&&player.ammo>0);
  setBtn('cPlank', String(player.planks), player.planks>0);
  setBtn('cBait', String(player.bait), player.bait>0);
  // 상황별 버튼
  let lbl='상호작용', icon='chest', on=false;
  const d=Math.hypot(hostage.x-player.x,hostage.y-player.y);
  const [mtx,mty]=w2t(player.x,player.y);
  const plankNear=[[0,0],[1,0],[-1,0],[0,1],[0,-1]].some(o=>plankAt(mtx+o[0],mty+o[1]));
  if(!hostage.rescued && d<=12*K){ icon='maiden_lying'; on=hostage.cool<=0;
    lbl= hostage.cool>0 ? '대기 '+Math.ceil(hostage.cool) : '구출(꾹)'; }
  else if(hostage.rescued && !hostage.following && d<=14*K){ lbl='데려가기'; icon='maiden_d0'; on=true; }
  else if(chestNear()){ lbl='상자 열기'; icon='chest'; on=true; }
  else if(plankNear){ lbl='목재 철거'; icon='plank_item'; on=true; }
  const key=lbl+'|'+on+'|'+icon;
  if(_btn.use!==key){ _btn.use=key;
    const L=document.getElementById('useLbl'), I=document.getElementById('useIcon');
    if(L) L.textContent=lbl; if(I&&IMG_SRC[icon]) I.src=IMG_SRC[icon];
    const host=document.querySelector('.a-use');
    if(host&&host.classList){ host.classList.toggle('off',!on); host.classList.toggle('ready',on); }
  }
}

function onAssetsReady(){
  document.querySelectorAll('img[data-icon]').forEach(im=>{ if(IMG_SRC[im.dataset.icon]) im.src=IMG_SRC[im.dataset.icon]; });
  const b=document.getElementById('startBtn');
  if(b){ b.textContent='시작'; b.classList.remove('wait'); }
  const art=document.querySelector('#screen .titleArt');
  if(art&&art.style) art.style.backgroundImage='url('+IMG_SRC.title+')';
  titleBest(); keyTip();
}

const T = 32;                 // 타일 = 32 도트 (유니티 2유닛에 해당)
const K = T/16;               // 예전 16도트 기준 거리값을 맞추는 배율
const CELLS = 15;             // 15x15칸 = 31x31타일
const GW = CELLS*2+1, GH = CELLS*2+1;
const U = T/2;                // 유니티 1유닛 = 16도트
const SPD_WALK = 6.8*U, SPD_RUN = 9.2*U;      // 괴물과 같은 기본 속도
const SPD_PATROL = 5.3*U, SPD_SEARCH = 6.2*U, SPD_CHASE = 8.2*U, ENRAGE = 0.25*U;   // 추격: 걷기(6.8)보다 빠르고 달리기(9.2)보다 느리다 → 걸으면 잡히고 달려야 떼어낸다
const VIEW = 14*U, HEAR = 10*U, HEAR_WALK = 4*U;   // 시야 7칸 · 달리는 소리 5칸 · 걷는 소리 2칸
const STUN = 8, AMMO = 3, PLANK_HP = 2, PLANK_MAX = 3;
const BOLT_SPOTS = 3, BOLTS_PER = 2;
const BAIT_SPOTS = 3, BAIT_MAX = 2, BAIT_EAT = 4;   // 미끼: 괴물이 4초간 먹느라 무시
const RESCUE_STAGES = 3, STAGE_TIME = 2.0;          // 구출: 3칸 × 2초, 칸마다 저장
const RESCUE_COOL = 5;                              // 한 칸 채운 뒤 다음 칸까지 대기 (괴물이 오는 중)
const FRAGMENTS = 4;                                // 열쇠 조각 4개 = 열쇠
const PIT_COUNT = 12;                               // 구덩이
// 5개 구역: 0 북(얼음) 1 동(대장간) 2 남(수로) 3 서(묘지) 4 중앙(둥지)
const REGION_KEY = ['ice','forge','moss','bone','nest'];
const REGION_NAME = ['북 · 얼어붙은 회랑','동 · 불의 대장간','남 · 이끼 낀 수로','서 · 뼈의 묘지','중앙 · 괴물의 둥지'];
function region(tx,ty){
  const dx=tx-nest[0], dy=ty-nest[1];
  if(Math.max(Math.abs(dx),Math.abs(dy))<=5) return 4;
  if(Math.abs(dx)>Math.abs(dy)) return dx>0?1:3;
  return dy>0?2:0;
}

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let VW=352, VH=256, PXSCALE=1, WIDE=false;
// 휴대폰(세로): 가로 352 고정, 남는 세로를 게임 화면에.
// 노트북(가로): 정수 배율(2~4배)로 창을 꽉 채운다 — 픽셀이 고르게 커지고, 보이는 범위가 창 비율에 맞춰진다.
function fitCanvas(){
  WIDE = innerWidth>innerHeight && innerWidth>=700;
  if(document.body&&document.body.classList) document.body.classList.toggle('wide',WIDE);
  if(WIDE){
    const sc=Math.max(2, Math.round(innerHeight/300));
    const w=Math.min(704, Math.floor(innerWidth/sc)), h=Math.min(400, Math.floor(innerHeight/sc));
    cv.width=w; cv.height=h; PXSCALE=sc;
    cv.style.width=(w*sc)+'px'; cv.style.height=(h*sc)+'px';
    document.documentElement.style.setProperty('--z', String(Math.max(1, Math.round(sc*0.62))));
  }else{
    const cssW=Math.min(innerWidth-12, 608), reserve=300;
    const cssH=Math.max(cssW*256/352, Math.min(innerHeight-reserve, cssW*1.5));
    cv.width=352; cv.height=Math.max(256, Math.min(528, Math.round(352*cssH/cssW)));
    cv.style.width=''; cv.style.height=''; PXSCALE=1;
    document.documentElement.style.setProperty('--z', '1');
  }
  ctx.imageSmoothingEnabled=false;
  VW=cv.width; VH=cv.height;
}

//  미로 생성 (유니티 MazeGenerator 와 같은 절차)
// ════════════════════════════════════════════════════════════
let wall, rooms, nest, exitT, startT;
const D4 = [[1,0],[-1,0],[0,1],[0,-1]];
const ct = (cx,cy)=>[cx*2+1, cy*2+1];
const inB = (x,y)=> x>=0&&y>=0&&x<GW&&y<GH;
const isWall = (x,y)=> !inB(x,y) || wall[x][y];

function genMaze(){
  wall = []; for(let x=0;x<GW;x++){ wall[x]=[]; for(let y=0;y<GH;y++) wall[x][y]=true; }
  const vis = []; for(let x=0;x<CELLS;x++){ vis[x]=[]; for(let y=0;y<CELLS;y++) vis[x][y]=false; }
  let cur = [(Math.random()*CELLS)|0, (Math.random()*CELLS)|0];
  vis[cur[0]][cur[1]]=true; let t=ct(cur[0],cur[1]); wall[t[0]][t[1]]=false;
  const stack=[cur];
  while(stack.length){
    const c = stack[stack.length-1];
    const ord = D4.slice().sort(()=>Math.random()-0.5);
    let moved=false;
    for(const [dx,dy] of ord){
      const nx=c[0]+dx, ny=c[1]+dy;
      if(nx<0||ny<0||nx>=CELLS||ny>=CELLS||vis[nx][ny]) continue;
      const a=ct(c[0],c[1]), b=ct(nx,ny);
      wall[(a[0]+b[0])>>1][(a[1]+b[1])>>1]=false; wall[b[0]][b[1]]=false;
      vis[nx][ny]=true; stack.push([nx,ny]); moved=true; break;
    }
    if(!moved) stack.pop();
  }
  // 막다른 길 뚫기
  for(let cy=0;cy<CELLS;cy++) for(let cx=0;cx<CELLS;cx++){
    const p=ct(cx,cy);
    let open=0; for(const [dx,dy] of D4) if(!isWall(p[0]+dx,p[1]+dy)) open++;
    if(open>1) continue;   // 막다른 길을 전부 없앤다
    const cand=[];
    for(const [dx,dy] of D4){
      const nc=[cx+dx,cy+dy];
      if(nc[0]<0||nc[1]<0||nc[0]>=CELLS||nc[1]>=CELLS) continue;
      const wt=[p[0]+dx,p[1]+dy];
      if(wall[wt[0]][wt[1]]) cand.push(wt);
    }
    if(cand.length){ const q=cand[(Math.random()*cand.length)|0]; wall[q[0]][q[1]]=false; }
  }
  // 둥지
  nest = ct(CELLS>>1, CELLS>>1);
  for(let y=nest[1]-2;y<=nest[1]+2;y++) for(let x=nest[0]-2;x<=nest[0]+2;x++)
    if(x>=1&&y>=1&&x<GW-1&&y<GH-1) wall[x][y]=false;
  // 방
  rooms=[]; let guard=0;
  while(rooms.length<9 && guard++<900){
    const rw=2+((Math.random()*2)|0), rh=2+((Math.random()*2)|0);
    const cx0=1+((Math.random()*Math.max(1,CELLS-rw-2))|0), cy0=1+((Math.random()*Math.max(1,CELLS-rh-2))|0);
    const t0=ct(cx0,cy0), t1=ct(cx0+rw-1,cy0+rh-1);
    const R={x:t0[0],y:t0[1],w:t1[0]-t0[0]+1,h:t1[1]-t0[1]+1};
    if(Math.abs(R.x+R.w/2-nest[0])<R.w/2+4 && Math.abs(R.y+R.h/2-nest[1])<R.h/2+4) continue;
    let ov=false;
    for(const o of rooms) if(!(R.x>=o.x+o.w+2||o.x>=R.x+R.w+2||R.y>=o.y+o.h+2||o.y>=R.y+R.h+2)) {ov=true;break;}
    if(ov) continue;
    for(let y=R.y;y<R.y+R.h;y++) for(let x=R.x;x<R.x+R.w;x++)
      if(x>=1&&y>=1&&x<GW-1&&y<GH-1) wall[x][y]=false;
    rooms.push(R);
  }
  // 출구
  const side=(Math.random()*4)|0, i=(Math.random()*CELLS)|0;
  exitT = side===0?[i*2+1,0] : side===1?[i*2+1,GH-1] : side===2?[0,i*2+1] : [GW-1,i*2+1];
  wall[exitT[0]][exitT[1]]=false;
  // 시작점 = 둥지에서 가장 먼 칸
  const dn=bfs(nest); let best=-1; startT=ct(0,0);
  for(let cy=0;cy<CELLS;cy++) for(let cx=0;cx<CELLS;cx++){
    const p=ct(cx,cy), d=dn[p[0]][p[1]];
    if(d<0) continue;
    const sc=d+Math.min(Math.abs(p[0]-exitT[0])+Math.abs(p[1]-exitT[1]),8);
    if(sc>best){best=sc; startT=p;}
  }
}

function bfsAvoid(src, blocked){
  const d=[]; for(let x=0;x<GW;x++){d[x]=[]; for(let y=0;y<GH;y++) d[x][y]=-1;}
  if(isWall(src[0],src[1])) return d;
  d[src[0]][src[1]]=0; const q=[src];
  for(let i=0;i<q.length;i++){
    const c=q[i];
    for(const [dx,dy] of D4){
      const n=[c[0]+dx,c[1]+dy];
      if(!inB(n[0],n[1])||wall[n[0]][n[1]]||d[n[0]][n[1]]>=0) continue;
      if(blocked.has(n[0]+','+n[1])) continue;
      d[n[0]][n[1]]=d[c[0]][c[1]]+1; q.push(n);
    }
  }
  return d;
}

function bfs(src){
  const d=[]; for(let x=0;x<GW;x++){d[x]=[]; for(let y=0;y<GH;y++) d[x][y]=-1;}
  if(isWall(src[0],src[1])) return d;
  d[src[0]][src[1]]=0; const q=[src];
  for(let i=0;i<q.length;i++){
    const c=q[i];
    for(const [dx,dy] of D4){
      const n=[c[0]+dx,c[1]+dy];
      if(!inB(n[0],n[1])||wall[n[0]][n[1]]||d[n[0]][n[1]]>=0) continue;
      d[n[0]][n[1]]=d[c[0]][c[1]]+1; q.push(n);
    }
  }
  return d;
}

// A* (목재가 놓인 칸은 비용이 비싸 우회한다)
function astar(s,g){
  if(isWall(s[0],s[1])||isWall(g[0],g[1])||(s[0]===g[0]&&s[1]===g[1])) return [];
  const id=(x,y)=>y*GW+x, N=GW*GH;
  const gs=new Int32Array(N).fill(2e9), fs=new Int32Array(N).fill(2e9),
        cf=new Int32Array(N).fill(-1), cl=new Uint8Array(N);
  const hh=(x,y)=>(Math.abs(x-g[0])+Math.abs(y-g[1]))*10;
  const open=[id(s[0],s[1])];
  gs[open[0]]=0; fs[open[0]]=hh(s[0],s[1]);
  let guard=0;
  while(open.length && guard++<20000){
    let bi=0; for(let i=1;i<open.length;i++) if(fs[open[i]]<fs[open[bi]]) bi=i;
    const cu=open.splice(bi,1)[0];
    if(cu===id(g[0],g[1])){
      const path=[]; let w=cu;
      while(w!==id(s[0],s[1])&&w!==-1){ path.push([w%GW,(w/GW)|0]); w=cf[w]; }
      return path.reverse();
    }
    cl[cu]=1;
    const cx=cu%GW, cy=(cu/GW)|0;
    for(const [dx,dy] of D4){
      const nx=cx+dx, ny=cy+dy;
      if(!inB(nx,ny)||wall[nx][ny]) continue;
      const ni=id(nx,ny); if(cl[ni]) continue;
      let cost=10; if(plankAt(nx,ny)) cost+=220;
      const tg=gs[cu]+cost;
      if(tg>=gs[ni]) continue;
      cf[ni]=cu; gs[ni]=tg; fs[ni]=tg+hh(nx,ny);
      if(open.indexOf(ni)<0) open.push(ni);
    }
  }
  return [];
}

let phase='title', runTime=0, player, monster, hostage, pickups, planks, darts, baits,
    props, torches, seen, keyPickup, exitOpen, toastT='', toastLeft=0, shake=0, flash=0,
    chests, pits, respawns, curRegion;

const tw = (tx,ty)=>[(tx+0.5)*T, (ty+0.5)*T];
const w2t = (px,py)=>[Math.floor(px/T), Math.floor(py/T)];
function plankAt(x,y){ for(const p of planks) if(p.tx===x&&p.ty===y) return p; return null; }

function reset(){
  genMaze();
  planks=[]; darts=[]; pickups=[]; props=[]; torches=[]; baits=[];
  chests=[]; pits=[]; respawns=[]; curRegion=-1;
  exitOpen=false; keyPickup=null; runTime=0; toastLeft=0; shake=0; flash=0;
  fxReset(); statsReset(); tipReset();
  _nc={tile:'',ver:-1,chest:null};   // 지난 판의 '다음 상자' 기억을 지운다

  seen=[]; for(let x=0;x<GW;x++){seen[x]=[]; for(let y=0;y<GH;y++) seen[x][y]=false;}

  const [px,py]=tw(startT[0],startT[1]);
  player={x:px,y:py,r:3.6*K,hp:6,hpMax:6,st:100,run:false,fx:0,fy:1,vx:0,vy:0,
          planks:1,bow:false,ammo:0,bait:1,key:false,frags:0,fall:0,aim:0,
          inv:0,bob:0,spd:0,knock:0,kx:0,ky:0};

  // 괴물은 플레이어에게서 먼 곳에서 시작
  const ds=bfs(startT); const pool=[];
  for(let x=0;x<GW;x++) for(let y=0;y<GH;y++)
    if(!wall[x][y]&&ds[x][y]>9&&!(Math.abs(x-nest[0])<=3&&Math.abs(y-nest[1])<=3)) pool.push([x,y]);
  const ms = pool.length?pool[(Math.random()*pool.length)|0]:nest;
  const [mx,my]=tw(ms[0],ms[1]);
  monster={x:mx,y:my,state:'dormant',path:[],pi:0,repath:0,lost:0,stun:0,stagger:0,tired:0,eat:0,mx:0,my:1,
           enraged:false,flip:false,plank:null,ptimer:0,lk:startT.slice()};

  const [hx,hy]=tw(nest[0],nest[1]);
  hostage={x:hx,y:hy,rescued:false,following:false,stage:0,prog:0,locked:false,cool:0,trail:[],fx:0,fy:1,anim:0,moving:false};

  // 아이템
  const open=[]; for(let x=0;x<GW;x++) for(let y=0;y<GH;y++) if(!wall[x][y]) open.push([x,y]);
  let maxd=0; for(const [x,y] of open) maxd=Math.max(maxd,ds[x][y]);
  const near=(t)=>Math.abs(t[0]-nest[0])<=3&&Math.abs(t[1]-nest[1])<=3;
  const cand=open.filter(t=>ds[t[0]][t[1]]>maxd*0.3&&ds[t[0]][t[1]]<maxd*0.7&&!near(t));
  const bt = cand.length?cand[(Math.random()*cand.length)|0]:startT;
  pickups.push(mk('crossbow',bt,AMMO));
  const used={}; used[bt]=1;
  let n=0,guard=0;
  while(n<4&&guard++<400){
    const t=open[(Math.random()*open.length)|0];
    if(used[t]||near(t)||ds[t[0]][t[1]]<3) continue;
    used[t]=1; pickups.push(mk('planks',t,1)); n++;
  }
  let nb=0; guard=0;
  while(nb<BOLT_SPOTS&&guard++<400){
    const t=open[(Math.random()*open.length)|0];
    if(used[t]||near(t)||ds[t[0]][t[1]]<maxd*0.35) continue;
    used[t]=1; pickups.push(mk('bolts',t,BOLTS_PER)); nb++;
  }
  let nm=0; guard=0;
  while(nm<BAIT_SPOTS&&guard++<400){
    const t=open[(Math.random()*open.length)|0];
    if(used[t]||near(t)||ds[t[0]][t[1]]<4) continue;
    used[t]=1; pickups.push(mk('meat',t,1)); nm++;
  }
  // ── 열쇠 조각 상자: 네 구역에 하나씩 ──
  // 예전엔 '시작점에서 가장 먼 곳'이라, 반대편 구석에서 두 구역의 상자가 경계를 사이에 두고 붙곤 했다.
  // 이제는 구역의 한가운데 축 근처(대각선 경계에서 3칸 이상)에서, 이미 놓인 상자와 최대한 멀리 고른다.
  const core=(t,r)=>{ const dx=Math.abs(t[0]-nest[0]), dy=Math.abs(t[1]-nest[1]); return (r===0||r===2)? dy-dx : dx-dy; };
  for(const r of [0,1,2,3].sort(()=>Math.random()-0.5)){
    let cand=open.filter(t=>region(t[0],t[1])===r && ds[t[0]][t[1]]>6 && !used[t] && core(t,r)>=3);
    if(!cand.length) cand=open.filter(t=>region(t[0],t[1])===r && ds[t[0]][t[1]]>6 && !used[t]);
    if(!cand.length) continue;
    const score=t=>{
      let m=99; for(const c of chests) m=Math.min(m,Math.hypot(c.tx-t[0],c.ty-t[1]));
      return Math.min(m,16)*2 + Math.min(core(t,r),8) + Math.min(ds[t[0]][t[1]],30)*0.15 + Math.random()*2;
    };
    let best=cand[0], bs=-1e9;
    for(const t of cand){ const v=score(t); if(v>bs){ bs=v; best=t; } }
    used[best]=1;
    chests.push({tx:best[0],ty:best[1],opened:false,reg:r});
  }
  // ── 동서남북 리스폰 지점 ──
  const dn2=bfs(nest);
  for(let r=0;r<4;r++){
    const cand=open.filter(t=>region(t[0],t[1])===r && !chests.some(c=>c.tx===t[0]&&c.ty===t[1]));
    if(!cand.length){ respawns.push(startT.slice()); continue; }
    let best=cand[0];
    for(const t of cand) if(dn2[t[0]][t[1]]>dn2[best[0]][best[1]]) best=t;
    respawns.push(best);
  }
  // ── 구덩이: 넣어도 모든 목적지(리스폰 포함)로 가는 우회로가 남는 칸에만 ──
  const pitSet=new Set();
  const targets=()=>[exitT, nest, startT, ...chests.map(c=>[c.tx,c.ty]), ...respawns];
  const stillConnected=()=>{ const d=bfsAvoid(startT,pitSet);
    for(const t of targets()) if(d[t[0]][t[1]]<0) return false; return true; };
  // 구덩이 주변의 열린 칸들이 구덩이를 밟지 않고 '가까이서' 서로 이어지는지 검사.
  // 외길 통로에서는 양쪽이 구덩이로만 이어지므로 탈락한다.
  const locallyAvoidable=(t)=>{
    const nb=D4.map(([dx,dy])=>[t[0]+dx,t[1]+dy]).filter(n=>!isWall(n[0],n[1]));
    if(nb.length<2) return false;
    const R=3, key=(x,y)=>x+','+y;
    const inBox=(x,y)=>Math.abs(x-t[0])<=R&&Math.abs(y-t[1])<=R;
    const seen=new Set([key(nb[0][0],nb[0][1])]); const q=[[nb[0][0],nb[0][1],0]];
    for(let i=0;i<q.length;i++){
      const [x,y,dd]=q[i]; if(dd>=8) continue;
      for(const [dx,dy] of D4){
        const nx=x+dx, ny=y+dy;
        if(!inBox(nx,ny)||isWall(nx,ny)||(nx===t[0]&&ny===t[1])) continue;
        if(pitSet.has(key(nx,ny))||seen.has(key(nx,ny))) continue;
        seen.add(key(nx,ny)); q.push([nx,ny,dd+1]);
      }
    }
    return nb.every(n=>seen.has(key(n[0],n[1])));
  };
  let npit=0; guard=0;
  while(npit<PIT_COUNT&&guard++<4000){
    const t=open[(Math.random()*open.length)|0];
    if(used[t]||region(t[0],t[1])===4||ds[t[0]][t[1]]<6) continue;
    if(t[0]===exitT[0]&&t[1]===exitT[1]) continue;
    if(chests.some(c=>Math.abs(c.tx-t[0])<=1&&Math.abs(c.ty-t[1])<=1)) continue;
    if(respawns.some(r=>Math.abs(r[0]-t[0])<=1&&Math.abs(r[1]-t[1])<=1)) continue;
    if(pits.some(q=>Math.abs(q.tx-t[0])<=2&&Math.abs(q.ty-t[1])<=2)) continue;
    if(!locallyAvoidable(t)) continue;
    pitSet.add(t[0]+','+t[1]);
    if(!stillConnected()){ pitSet.delete(t[0]+','+t[1]); continue; }
    used[t]=1; pits.push({tx:t[0],ty:t[1]}); npit++;
  }

  // 소품
  // 넓은 방에 구역 소품 (대장간 = 모루·화로, 둥지 = 화로)
  for(const R of rooms){
    const r=region(R.x+(R.w>>1),R.y+(R.h>>1));
    const corners=[[R.x,R.y],[R.x+R.w-1,R.y]];
    for(const c of corners){
      if(!inB(c[0],c[1])||wall[c[0]][c[1]]) continue;
      if(pits.some(q=>q.tx===c[0]&&q.ty===c[1])||chests.some(h=>h.tx===c[0]&&h.ty===c[1])) continue;
      if(r===1||r===4) props.push({s:'brazier',t:c,dy:-4});
    }
    const mid=[R.x+(R.w>>1),R.y+(R.h>>1)];
    if(r===1 && !wall[mid[0]][mid[1]] && !chests.some(h=>h.tx===mid[0]&&h.ty===mid[1])) props.push({s:'anvil_d',t:mid,dy:0});
  }
  for(const o of [[-2,-2],[2,-2]]){
    const t=[nest[0]+o[0],nest[1]+o[1]];
    if(inB(t[0],t[1])&&!wall[t[0]][t[1]]) props.push({s:'brazier',t:t,dy:-4});
  }
  for(let i=0;i<70;i++){
    const t=open[(Math.random()*open.length)|0];
    if(pits.some(q=>q.tx===t[0]&&q.ty===t[1])) continue;
    const r=region(t[0],t[1]);
    if(r===4){ if(Math.random()<0.5) props.push({s:Math.random()<0.6?'skull_d':'bones_d',t:t,dy:0}); }
    else if(r===3){ if(Math.random()<0.3) props.push({s:Math.random()<0.5?'skull_d':'bones_d',t:t,dy:0}); }
  }
  const wallSpots=[];
  for(let y=1;y<GH-1;y++) for(let x=1;x<GW-1;x++) if(wall[x][y]&&!wall[x][y-1]) wallSpots.push([x,y]);
  wallSpots.sort(()=>Math.random()-0.5);
  for(let i=0;i<Math.min(10,wallSpots.length);i++) torches.push({t:wallSpots[i],ph:Math.random()*6});
  for(let i=10;i<Math.min(16,wallSpots.length);i++) torches.push({t:wallSpots[i],ph:Math.random()*6});
}

// 제목·도입·결과 화면의 키보드 조작 (마우스 없이 부스 운영)
function menuKey(ev){
  const k=ev.key, intro=document.getElementById('intro');
  if(intro && intro.classList && !intro.classList.contains('hide')){
    if(k==='Escape'){ introEnd(); ev.preventDefault(); return true; }
    if(k==='Enter'||k===' '){ introNext(); ev.preventDefault(); return true; }
    return true;
  }
  if(phase==='title'){
    if((k==='Enter'||k===' ') && document.getElementById('startBtn')){ ev.preventDefault(); playIntro(); return true; }
    return false;
  }
  if(phase==='over'||phase==='cleared'){
    if(k==='Enter'||k===' '){ ev.preventDefault(); start(); return true; }
    if(k==='h'||k==='H'||k==='Escape'){ ev.preventDefault(); showTitle(); return true; }
  }
  return false;
}

const joy={x:0,y:0,mag:0,id:null,active:false};
(function(){
  const pad=document.getElementById('joy'), knob=document.getElementById('knob'), ring=document.getElementById('joyRing');
  if(!pad||!pad.getBoundingClientRect) return;
  const R=56;
  function setFrom(cx,cy){
    const r=pad.getBoundingClientRect(); const ox=r.left+r.width/2, oy=r.top+r.height/2;
    let dx=cx-ox, dy=cy-oy; const d=Math.hypot(dx,dy);
    if(d>R){ dx*=R/d; dy*=R/d; }
    joy.mag=Math.min(1,d/R); joy.x=dx/R; joy.y=dy/R;
    knob.style.transform='translate('+dx+'px,'+dy+'px)';
    ring.classList.toggle('run', joy.mag>0.85);
  }
  function reset(){ joy.x=joy.y=joy.mag=0; joy.id=null; joy.active=false;
    knob.style.transform='translate(0,0)'; ring.classList.remove('run'); }
  pad.addEventListener('touchstart',ev=>{ ev.preventDefault(); const t=ev.changedTouches[0];
    joy.id=t.identifier; joy.active=true; setFrom(t.clientX,t.clientY); },{passive:false});
  pad.addEventListener('touchmove',ev=>{ ev.preventDefault();
    for(const t of ev.changedTouches) if(t.identifier===joy.id) setFrom(t.clientX,t.clientY); },{passive:false});
  const end=ev=>{ for(const t of ev.changedTouches) if(t.identifier===joy.id) reset(); };
  pad.addEventListener('touchend',end,{passive:false}); pad.addEventListener('touchcancel',end,{passive:false});
  let mdown=false;
  pad.addEventListener('mousedown',ev=>{ mdown=true; joy.active=true; setFrom(ev.clientX,ev.clientY); });
  addEventListener('mousemove',ev=>{ if(mdown) setFrom(ev.clientX,ev.clientY); });
  addEventListener('mouseup',()=>{ if(mdown){ mdown=false; reset(); } });
})();

function axis(){
  let dx=0,dy=0;
  if(keys['a']||keys['arrowleft']||held.left) dx-=1;
  if(keys['d']||keys['arrowright']||held.right) dx+=1;
  if(keys['w']||keys['arrowup']||held.up) dy-=1;
  if(keys['s']||keys['arrowdown']||held.down) dy+=1;
  if(joy.active && joy.mag>0.2){
    const deg=(Math.atan2(joy.y,joy.x)*180/Math.PI+360)%360;
    const card=Math.round(deg/90)*90;
    const snap = Math.abs(deg-card)<=30 ? card : Math.round((deg-45)/90)*90+45;
    const rad=snap*Math.PI/180;
    dx=Math.round(Math.cos(rad)*1000)/1000; dy=Math.round(Math.sin(rad)*1000)/1000;
  }
  const m=Math.hypot(dx,dy);
  return m>0 ? [dx/m, dy/m] : [0,0];      // 항상 단위 방향 (속도는 걷기/달리기로만 결정)
}

//  소리 — 전부 코드로 합성 (파일 없음)
//  MASTER ─┬─ SFX (효과음)
//          └─ MUS (배경음: 낮은 울림 + 드문드문 단조 아르페지오 + 추격 박동 + 심장 소리) → 메아리

let AC=null, MASTER=null, SFX=null, MUS=null, NOISE=null, muted=false;
try{ muted=localStorage.getItem('maze_mute')==='1'; }catch(e){}
function audioInit(){
  if(AC) return AC;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    MASTER=AC.createGain(); MASTER.gain.value=muted?0:0.9; MASTER.connect(AC.destination);
    SFX=AC.createGain(); SFX.gain.value=1; SFX.connect(MASTER);
    MUS=AC.createGain(); MUS.gain.value=0.8; MUS.connect(MASTER);
    // 배경음에만 거는 메아리 (미궁의 울림)
    const dl=AC.createDelay(1), fb=AC.createGain(), lp=AC.createBiquadFilter();
    dl.delayTime.value=0.36; fb.gain.value=0.38; lp.type='lowpass'; lp.frequency.value=1400;
    MUS.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(MASTER);
    NOISE=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    const d=NOISE.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }catch(e){ AC=null; }
  return AC;
}
// 첫 터치·키 입력에서 소리를 깨운다 (브라우저 자동재생 정책)
['pointerdown','touchstart','keydown'].forEach(ev=>addEventListener(ev,()=>{
  if(!audioInit()) return; if(AC.state==='suspended') AC.resume().catch(()=>{}); },{passive:true}));

function setMuted(m){
  muted=m; try{ localStorage.setItem('maze_mute',m?'1':'0'); }catch(e){}
  if(MASTER) MASTER.gain.setTargetAtTime(m?0:0.9,AC.currentTime,0.05);
  const b=document.getElementById('muteBtn'); if(b){ b.classList.toggle('off',m); b.setAttribute('aria-label', m?'소리 켜기':'소리 끄기'); }
}
const aOK=()=> AC && AC.state==='running' && !muted;

function beep(f1,f2,dur,type,vol,when,bus){
  if(!audioInit()||muted) return;
  try{
    const t=(when||AC.currentTime), o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f1,t);
    if(f2!==f1) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(bus||SFX); o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
function noise(dur,vol,freq,q,ftype,when,bus,f2){
  if(!audioInit()||muted) return;
  try{
    const t=(when||AC.currentTime), s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();
    s.buffer=NOISE; s.playbackRate.value=0.7+Math.random()*0.6;
    f.type=ftype||'bandpass'; f.frequency.setValueAtTime(freq||1000,t); f.Q.value=q||1;
    if(f2) f.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(bus||SFX); s.start(t,Math.random()*0.5); s.stop(t+dur+0.02);
  }catch(e){}
}
const at=(s)=>AC?AC.currentTime+s:0;

const BGM={drone:null, droneG:null, next:0, step:0, beatNext:0};
const SCALE=[220,261.63,293.66,329.63,392,440,523.25];         // 가단조 계열
function musicTick(){
  if(!aOK()) return;
  const live=playing();
  if(!BGM.drone){
    BGM.droneG=AC.createGain(); BGM.droneG.gain.value=0;
    const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=260; lp.Q.value=2;
    BGM.lp=lp; lp.connect(BGM.droneG); BGM.droneG.connect(MUS);
    BGM.drone=[55,55.35,82.4].map((f,i)=>{ const o=AC.createOscillator(); o.type=i===2?'triangle':'sawtooth'; o.frequency.value=f; o.connect(lp); o.start(); return o; });
    BGM.next=AC.currentTime+0.1; BGM.beatNext=AC.currentTime+0.5;
  }
  const M=monster, md=(M&&player)?Math.hypot(M.x-player.x,M.y-player.y)/T:99;
  const chase=live && M && M.state==='chase';
  const danger=live && M && M.state!=='stun' && M.state!=='dormant' ? Math.max(0,1-md/9) : 0;
  BGM.droneG.gain.setTargetAtTime(live?0.05+danger*0.04:0.0,AC.currentTime,0.6);
  BGM.lp.frequency.setTargetAtTime(chase?520:260,AC.currentTime,0.4);
  if(!live){ BGM.next=AC.currentTime+0.2; BGM.beatNext=AC.currentTime+0.3; return; }

  // 아르페지오: 평소엔 드문드문, 추격 중엔 빠르고 촘촘하게 + 낮은 박동
  const stepLen=chase?0.19:0.42;
  while(BGM.next<AC.currentTime+0.15){
    const t=BGM.next; BGM.step++;
    if(Math.random()<(chase?0.8:0.45)){
      const base=chase?[0,2,3,1]:[0,2,4,3,5,1,2,6];
      const f=SCALE[base[BGM.step%base.length]]*(Math.random()<0.2?2:1);
      beep(f,f,chase?0.25:0.9,'triangle',chase?0.035:0.03,t,MUS);
    }
    if(chase && BGM.step%2===0) beep(55,52,0.16,'square',0.05,t,MUS);
    if(phase==='escape' && BGM.step%4===0) beep(110,110,0.3,'sine',0.05,t,MUS);
    BGM.next+=stepLen;
  }
  // 괴물이 가까우면 심장 소리 (가까울수록 빠르게)
  if(danger>0.15){
    const per=1.0-danger*0.55;
    while(BGM.beatNext<AC.currentTime+0.15){
      const t=BGM.beatNext;
      beep(70,44,0.13,'sine',0.12+danger*0.2,t,SFX); beep(64,40,0.12,'sine',0.08+danger*0.15,t+0.17,SFX);
      BGM.beatNext+=per;
    }
  } else BGM.beatNext=AC.currentTime+0.2;
}


// ════════════════════════════════════════════════════════════
//  충돌
// ════════════════════════════════════════════════════════════
function solid(x,y){
  const [tx,ty]=w2t(x,y);
  return solidTile(tx,ty);
}
function solidTile(tx,ty){
  if(isWall(tx,ty)) return true;
  const p=plankAt(tx,ty);
  return !!p && !p.ghost;
}
function overlapsTile(x,y,r,tx,ty){
  return x+r>tx*T && x-r<(tx+1)*T && y+r>ty*T && y-r<(ty+1)*T;
}
function blocked(cx,cy,r){
  return solid(cx-r,cy-r)||solid(cx+r,cy-r)||solid(cx-r,cy+r)||solid(cx+r,cy+r);
}
// 가려는 축이 막혔을 때, 바로 옆 칸 줄이 열려 있으면 그 줄 중앙으로 몸을 밀어 넣는다
function cornerAssist(ax, d){
  const r=player.r, s=Math.sign(d), step=Math.max(1.5, Math.abs(d)*1.1);
  if(ax==='x'){
    const tx=Math.floor((player.x+s*(r+1))/T), ty0=Math.floor(player.y/T);
    let best=null, bd=1e9;
    for(const ty of [ty0-1,ty0,ty0+1]){
      if(solidTile(tx,ty)) continue;
      const cy=(ty+0.5)*T, dd=Math.abs(cy-player.y);
      if(dd<bd && dd<T*0.7){ bd=dd; best=cy; }
    }
    if(best===null || bd<0.3) return false;
    const ny=player.y+Math.sign(best-player.y)*Math.min(step,bd);
    if(blocked(player.x,ny,r)) return false;
    player.y=ny; return true;
  }else{
    const ty=Math.floor((player.y+s*(r+1))/T), tx0=Math.floor(player.x/T);
    let best=null, bd=1e9;
    for(const tx of [tx0-1,tx0,tx0+1]){
      if(solidTile(tx,ty)) continue;
      const cx=(tx+0.5)*T, dd=Math.abs(cx-player.x);
      if(dd<bd && dd<T*0.7){ bd=dd; best=cx; }
    }
    if(best===null || bd<0.3) return false;
    const nx=player.x+Math.sign(best-player.x)*Math.min(step,bd);
    if(blocked(nx,player.y,r)) return false;
    player.x=nx; return true;
  }
}
// 몸이 벽·목재에 박혀 있으면 가장 가까운 빈자리로 빼낸다
function unstick(){
  const r=player.r;
  if(!blocked(player.x,player.y,r)) return;
  for(let rad=1; rad<=T*0.6; rad+=1){
    for(let a=0;a<8;a++){
      const nx=player.x+Math.cos(a*Math.PI/4)*rad, ny=player.y+Math.sin(a*Math.PI/4)*rad;
      if(!blocked(nx,ny,r)){ player.x=nx; player.y=ny; return; }
    }
  }
}
function moveP(dx,dy){
  const r=player.r;
  unstick();
  if(dx){
    if(!blocked(player.x+dx,player.y,r)) player.x+=dx;
    else if(!(Math.abs(dy)<Math.abs(dx)*0.35 && cornerAssist('x',dx))) player.vx*=0.2;
  }
  if(dy){
    if(!blocked(player.x,player.y+dy,r)) player.y+=dy;
    else if(!(Math.abs(dx)<Math.abs(dy)*0.35 && cornerAssist('y',dy))) player.vy*=0.2;
  }
  // 걸쳐 있던 목재에서 완전히 벗어나면 그때부터 단단해진다
  for(const p of planks) if(p.ghost && !overlapsTile(player.x,player.y,r,p.tx,p.ty)) p.ghost=false;
}
// 좁은 통로에서는 자동으로 중앙에 맞춰 준다 (모서리에 걸리는 느낌 제거)
function centerInCorridor(dt){
  const [tx,ty]=w2t(player.x,player.y);
  const cx=(tx+0.5)*T, cy=(ty+0.5)*T, rate=40*K*dt;
  const h=Math.abs(player.vx), v=Math.abs(player.vy);
  if(h>v+3*K && isWall(tx,ty-1) && isWall(tx,ty+1)){
    const d=cy-player.y; if(Math.abs(d)>0.3) player.y+=Math.sign(d)*Math.min(rate,Math.abs(d));
  }
  if(v>h+3*K && isWall(tx-1,ty) && isWall(tx+1,ty)){
    const d=cx-player.x; if(Math.abs(d)>0.3) player.x+=Math.sign(d)*Math.min(rate,Math.abs(d));
  }
}

  monster.state='guard'; monster.path=astar(w2t(monster.x,monster.y),nest); monster.pi=0; }
function onRescued(){

  monster.lk=w2t(player.x,player.y);
  monster.path=astar(w2t(monster.x,monster.y),monster.lk); monster.pi=0;
  sRoar(); shake=1.2;
  resupply('미로 곳곳에 물자가 다시 나타났다');

    phase='escape'; exitOpen=true; player.key=true;

  }else{

    toast('괴물이 깨어났다! 상자에서 열쇠 조각을 찾아라');
  }
}
// 걸어서 가장 가까운 안 연 상자. 플레이어가 칸을 옮길 때만 다시 계산한다.
let _nc={tile:'',ver:-1,chest:null};
function nextChestTarget(){
  const pt=w2t(player.x,player.y), k=pt.join(','), ver=chests.filter(c=>c.opened).length;
  if(_nc.tile===k && _nc.ver===ver && (!_nc.chest||!_nc.chest.opened)) return _nc.chest;
  // 사람이 실제로 걷는 거리 = 구덩이를 피해 돌아가는 거리
  const P=new Set(pits.map(q=>q.tx+','+q.ty)); P.delete(k);
  let d=bfsAvoid(pt,P); let best=null, bd=1e9;
  for(const c of chests){ if(c.opened) continue; const v=d[c.tx][c.ty]; if(v>=0&&v<bd){bd=v;best=c;} }
  if(!best){ d=bfs(pt); for(const c of chests){ if(c.opened) continue; const v=d[c.tx][c.ty]; if(v>=0&&v<bd){bd=v;best=c;} } }
  // 다른 상자가 조금(3칸 이내) 더 가까워져도 원래 목표를 유지 (돌아가는 길에서 깜빡임 방지)
  if(_nc.chest && !_nc.chest.opened && best!==_nc.chest){ const v=d[_nc.chest.tx][_nc.chest.ty]; if(v>=0 && v<=bd+3) best=_nc.chest; }
  _nc={tile:k,ver:ver,chest:best}; return best;
}
function chestNear(){
  const [tx,ty]=w2t(player.x,player.y);
  for(const c of chests){ if(c.opened) continue;
    if(Math.abs(c.tx-tx)<=1&&Math.abs(c.ty-ty)<=1) return c; }
  return null;
}
function onFragment(){
  if(player.frags>=FRAGMENTS){
    player.key=true; exitOpen=true;
    if(phase==='key'){ phase='escape'; setObj('출구로 탈출하라'); }
    toast('조각을 맞춰 열쇠를 만들었다!'); sWin(); return;
  }
  if(phase==='key') setObj('열쇠 조각을 모아라 ('+player.frags+'/'+FRAGMENTS+')');
  if(player.frags===2) resupply('물자를 다시 찾아냈다');
}
function resupply(msg){
  const open=[]; for(let x=0;x<GW;x++) for(let y=0;y<GH;y++) if(!wall[x][y]) open.push([x,y]);
  const ds=bfs(w2t(player.x,player.y));
  const taken=new Set([exitT[0]+','+exitT[1],
    ...pits.map(q=>q.tx+','+q.ty), ...chests.map(c=>c.tx+','+c.ty), ...planks.map(q=>q.tx+','+q.ty),
    ...pickups.map(p=>w2t(p.x,p.y).join(','))]);
  const cand=open.filter(t=>ds[t[0]][t[1]]>8 && region(t[0],t[1])!==4 && !taken.has(t[0]+','+t[1]));
  for(const [kind,cnt] of [['planks',2],['bolts',1],['meat',1]])
    for(let i=0;i<cnt&&cand.length;i++){
      const t=cand.splice((Math.random()*cand.length)|0,1)[0];
      pickups.push(mk(kind,t,kind==='bolts'?BOLTS_PER:1));
    }
  toast(msg);
}

// ════════════════════════════════════════════════════════════
//  업데이트
// ════════════════════════════════════════════════════════════
const playing = ()=> phase==='bow'||phase==='rescue'||phase==='key'||phase==='escape';

function update(dt){
  if(tapped.restart){ tapped.restart=0; if(phase!=='title') start(); }
  if(toastLeft>0) toastLeft-=dt;
  if(shake>0) shake=Math.max(0,shake-dt*3);
  if(flash>0) flash=Math.max(0,flash-dt*2);
  if(!playing()){ tapped.fire=0; tapped.plank=0; return; }

  runTime+=dt;

  // ── 플레이어 ──
  let [dx,dy]=axis();
  if(dx||dy){ player.fx=dx; player.fy=dy; }

  const canRun = wantRun() && (dx||dy) && player.st>0;
  player.run = canRun;
  if(canRun){ player.st=Math.max(0,player.st-21*dt); }
  else player.st=Math.min(100,player.st+26*dt);

  let sp = player.run?SPD_RUN:SPD_WALK;
  if(hostage.following) sp*=0.9;

  if(player.fall>0){
    player.fall-=dt; player.vx=player.vy=0;
    player.st=Math.min(100,player.st+26*dt);
    return;
  }
  const ox=player.x, oy=player.y, knocked=player.knock>0;
  if(player.knock>0){
    player.knock-=dt;
    moveP(player.kx*dt, player.ky*dt);
    player.kx*=0.88; player.ky*=0.88;
    player.vx=player.vy=0;
  } else {
    // 목표 속도로 부드럽게 붙는다. 손을 떼면 더 빨리 멈춘다 (멈출 때 미끄러지지 않게)
    const k=1-Math.exp(-((dx||dy)?20:45)*dt);
    player.vx+=(dx*sp-player.vx)*k;
    player.vy+=(dy*sp-player.vy)*k;
    if(Math.abs(player.vx)<0.5) player.vx=0;
    if(Math.abs(player.vy)<0.5) player.vy=0;
    moveP(player.vx*dt, player.vy*dt);
    centerInCorridor(dt);
  }

  // 걷는 그림은 '실제로 움직인 거리'만큼 넘긴다 — 벽에 막히면 제자리걸음 없이 서 있고,
  // 속도가 줄면 발걸음도 같이 느려져서 발이 바닥에서 미끄러져 보이지 않는다
  const moved=Math.hypot(player.x-ox,player.y-oy);
  player.spd = dt>0 ? moved/dt : 0;
  if(!knocked && player.spd>12) player.bob+=moved/HUNTER_STRIDE;
  if(player.inv>0) player.inv-=dt;
  if(player.aim>0) player.aim-=dt;
  if(hostage.cool>0) hostage.cool-=dt;

  // 아이템 줍기
  for(let i=pickups.length-1;i>=0;i--){
    const p=pickups[i];
    if(Math.hypot(p.x-player.x,p.y-player.y)>10*K) continue;
    pickups.splice(i,1); sPick(); fxPickup(p);
    if(p.s==='planks'){ player.planks=Math.min(PLANK_MAX,player.planks+p.amt); toast('목재를 주웠다'); }
    else if(p.s==='crossbow'){ onBow(p.amt); }
    else if(p.s==='bolts'){ player.ammo+=p.amt;
      toast(player.bow? '수면화살 +'+p.amt : '수면화살을 주웠다 (석궁이 필요하다)'); }
    else if(p.s==='meat'){ player.bait=Math.min(BAIT_MAX,player.bait+p.amt);
      toast('미끼를 주웠다 (던지면 괴물이 달려간다)'); }
    else if(p.s==='key'){ onKey(); }
  }

  // 목재 설치 / 회수
  if(tapped.plank){
    tapped.plank=0;
    if(player.planks<=0) toast('목재가 없다');
    else{
      const [mtx,mty]=w2t(player.x,player.y);
      // 바라보는 방향의 '반대쪽' = 따라오는 괴물을 막는 자리
      const step = Math.abs(player.fx)>Math.abs(player.fy)
        ? [player.fx>0?-1:1,0] : [0,player.fy>0?-1:1];
      const tx=mtx+step[0], ty=mty+step[1];
      if(isWall(tx,ty)) toast('여기엔 놓을 수 없다');
      else if(plankAt(tx,ty)) toast('이미 설치되어 있다');
      else if(tx===exitT[0]&&ty===exitT[1]) toast('출구는 막을 수 없다');
      else { planks.push({tx:tx,ty:ty,hp:PLANK_HP,ghost:overlapsTile(player.x,player.y,player.r,tx,ty)}); player.planks--; sThud(); fxPlankPlace(tx,ty); stats.planks++;
             toast('등 뒤에 목재를 세웠다'); }
    }
  }
  if(!wantUse()) hostage.locked=false;   // 버튼을 떼면 몸부림 잠금 해제

  if(wantUse()){
    const d=Math.hypot(hostage.x-player.x,hostage.y-player.y);
    const chest=chestNear();
    if(!hostage.rescued && d<=12*K){
      if(!hostage.locked && hostage.cool<=0){
        hostage.prog+=dt/STAGE_TIME;
        if(hostage.prog>=1){
          hostage.stage++; hostage.prog=0;
          if(hostage.stage>=RESCUE_STAGES){
            hostage.rescued=true; hostage.following=true;
            toast('인질을 구했다! 함께 탈출하라'); onRescued();
          }else{
            hostage.locked=true;   // 한 칸마다 몸부림 — 채운 칸은 유지
            hostage.cool=RESCUE_COOL;
            summonMonster();
            toast('공주의 비명에 괴물이 달려온다! ('+hostage.stage+'/'+RESCUE_STAGES+')');
            sHurt(); shake=0.8;
          }
        }
      }
    }else if(hostage.rescued && !hostage.following && d<=14*K){
      hostage.following=true; hostage.trail=[]; sPick(); toast('다시 인질을 데려간다');
    }else if(chest){
      chest.opened=true; player.frags++; shake=0.3; fxChest(chest);
      toast('열쇠 조각 ('+player.frags+'/'+FRAGMENTS+')'); onFragment();
    }else{
      // 목재 철거 — 칸이 남으면 회수하고, 꽉 찼으면 그냥 부순다 (갇히지 않게)
      const [mtx,mty]=w2t(player.x,player.y);
      for(const o of [[0,0],[1,0],[-1,0],[0,1],[0,-1]]){
        const p=plankAt(mtx+o[0],mty+o[1]);
        if(!p) continue;
        planks.splice(planks.indexOf(p),1);
        if(player.planks<PLANK_MAX){ player.planks++; sPick(); toast('목재를 회수했다'); }
        else { sThud(); toast('목재를 부쉈다'); }
        break;
      }
    }
  } else if(!hostage.rescued) hostage.prog=Math.max(0,hostage.prog-dt*0.6);

  // 미끼 던지기 — 괴물이 그쪽으로 달려가 4초간 먹느라 플레이어를 무시한다
  if(tapped.bait){
    tapped.bait=0;
    if(player.bait<=0) toast('미끼가 없다');
    else{
      const [mtx,mty]=w2t(player.x,player.y);
      const st = Math.abs(player.fx)>Math.abs(player.fy)
        ? [player.fx>0?1:-1,0] : [0,player.fy>0?1:-1];
      let lx=mtx, ly=mty;
      for(let i=1;i<=3;i++){
        const nx=mtx+st[0]*i, ny=mty+st[1]*i;
        if(isWall(nx,ny)) break;
        lx=nx; ly=ny;
      }
      const [bx,by]=tw(lx,ly);
      baits.push({x:bx,y:by,ph:0});
      player.bait--; stats.baits++;
      toast('미끼를 던졌다');
      sThud();
      if(monster.state!=='stun'){
        monster.state='bait';
        monster.path=astar(w2t(monster.x,monster.y),[lx,ly]);
        monster.pi=0; monster.tired=0;
      }
    }
  }

  // 석궁
  if(tapped.fire){
    tapped.fire=0;
    if(!player.bow) toast('무기가 없다');
    else if(player.ammo<=0) toast('화살이 없다');
    else{
      player.ammo--; stats.shots++;
      const n=Math.hypot(player.fx,player.fy)||1;
      darts.push({x:player.x,y:player.y,vx:player.fx/n*15*U,vy:player.fy/n*15*U,life:1.3}); player.aim=0.4;
      sShoot();
    }
  }
  for(let i=darts.length-1;i>=0;i--){
    const d=darts[i];
    d.x+=d.vx*dt; d.y+=d.vy*dt; d.life-=dt; fxDartTrail(d);
    const [tx,ty]=w2t(d.x,d.y);
    if(d.life<=0||isWall(tx,ty)||plankAt(tx,ty)){ darts.splice(i,1); continue; }   // 조준선과 같은 규칙
    if(Math.hypot(d.x-monster.x,d.y-monster.y)<8*K){
      darts.splice(i,1);
      monster.state='stun'; monster.stun=STUN; monster.path=[]; monster.plank=null;
      sStun(); fxStun(); stats.stuns++; toast('명중! 괴물이 쓰러졌다');
    }
  }

  checkPit();
  checkRegion();
  updateMonster(dt);
  updateHostage(dt);

  // 출구
  if(Math.abs(player.x-(exitT[0]+0.5)*T)<10*K && Math.abs(player.y-(exitT[1]+0.5)*T)<10*K){
    if(!exitOpen) { if(toastLeft<=0) toast(hostage.rescued
        ? '열쇠 조각 '+player.frags+'/'+FRAGMENTS : '인질을 먼저 구해야 한다'); }
    else if(!hostage.following) toast('인질을 데려와야 한다');
    else win();
  }

  // 미니맵 탐색
  const [ptx,pty]=w2t(player.x,player.y);
  for(let y=pty-7;y<=pty+7;y++) for(let x=ptx-7;x<=ptx+7;x++)
    if(inB(x,y)&&(x-ptx)*(x-ptx)+(y-pty)*(y-pty)<=49) seen[x][y]=true;
}

function checkPit(){
  if(player.fall>0) return;
  const [tx,ty]=w2t(player.x,player.y);
  if(!pits.some(q=>q.tx===tx&&q.ty===ty)) return;
  const cx=(tx+0.5)*T, cy=(ty+0.5)*T;
  if(Math.hypot(player.x-cx,player.y-cy)>5*K) return;
  const r=respawns[(Math.random()*respawns.length)|0];
  const [rx,ry]=tw(r[0],r[1]);
  player.x=rx; player.y=ry; player.vx=player.vy=0;
  player.fall=1.0; player.inv=Math.max(player.inv,1.4);
  const lost=[];
  if(player.planks>0){ lost.push('목재'); player.planks=0; }
  if(player.ammo>0){ lost.push('수면화살'); player.ammo=0; }
  if(player.bait>0){ lost.push('미끼'); player.bait=0; }
  if(hostage.rescued){
    // 구출은 유지하되 공주는 둥지 한가운데로 돌아간다 — 다시 데리러 가야 한다
    const [hx,hy]=tw(nest[0],nest[1]);
    hostage.x=hx; hostage.y=hy; hostage.following=false; hostage.trail=[];
    hostage.fx=0; hostage.fy=1;
  }
  shake=1.4; flash=0.8; fxFall(cx,cy); stats.falls++;
  toast((lost.length?('구덩이에 빠졌다! '+lost.join('·')+'을 잃었다'):'구덩이에 빠졌다!')+(hostage.rescued?' — 공주가 둥지로 끌려갔다':''));
  curRegion=-1;
}
// 공주가 비명을 지르면 괴물은 무엇을 하고 있었든(잠·식사 포함) 둥지로 달려온다
function summonMonster(){
  const M=monster;
  M.stun=0; M.eat=0; M.stagger=0; M.plank=null;
  M.state='chase'; M.summoned=6; M.lost=0; M.tired=0; M.repath=0;
  M.lk=w2t(hostage.x,hostage.y);
  sRoar();
}

function checkRegion(){
  const [tx,ty]=w2t(player.x,player.y);
  const r=region(tx,ty);
  if(r===curRegion) return;
  curRegion=r; toast(REGION_NAME[r]);
}

function updateMonster(dt){
  const M=monster;
  if(M.state==='dormant') return;
  if(M.summoned>0) M.summoned-=dt;            // 호출 가속은 6초만 (보고 있든 아니든)
  if(M.stagger>0){ M.stagger-=dt; return; }

  // 미끼를 먹는 중 — 플레이어를 완전히 무시한다
  if(M.state==='eat'){
    M.eat-=dt;
    if(M.eat<=0){ M.state='patrol'; M.tired=0; M.path=[]; M.pi=0; sRoar(); }
    return;
  }
  // 미끼로 달려가는 중 — 감지 판정을 건너뛴다
  if(M.state==='bait'){
    let bi=-1, bd=1e9;
    for(let i=0;i<baits.length;i++){
      const d=Math.hypot(baits[i].x-M.x,baits[i].y-M.y);
      if(d<bd){bd=d; bi=i;}
    }
    if(bi<0){ M.state='patrol'; M.path=[]; M.pi=0; }
    else if(bd<10*K){
      baits.splice(bi,1);
      M.state='eat'; M.eat=BAIT_EAT; M.path=[]; M.pi=0; fxBaitEat();
      toast('괴물이 미끼를 먹고 있다!');
      sThud();
      return;
    } else {
      M.repath-=dt;
      if(M.repath<=0){
        M.path=astar(w2t(M.x,M.y), w2t(baits[bi].x,baits[bi].y));
        M.pi=0; M.repath=0.4;
      }
      moveMonster(dt);
      touchPlayer();
      return;
    }
  }

  if(M.state==='stun'){
    M.stun-=dt;
    if(M.stun<=0){ M.state='search'; M.lk=w2t(player.x,player.y);
      M.path=astar(w2t(M.x,M.y),M.lk); M.pi=0; sRoar(); }
    return;
  }

  // 감지
  const d=Math.hypot(player.x-M.x,player.y-M.y);
  const mt=w2t(M.x,M.y), pt=w2t(player.x,player.y);
  const moving = !!(axis()[0]||axis()[1]);
  const eff = VIEW*(moving?1:0.6);
  const sees = d<=eff && los(mt,pt);
  const hears = (player.run && d<=HEAR) || (moving && d<=HEAR_WALK);
  if(sees||hears){
    M.lk=pt; M.lost=0;
    if(M.state!=='chase'&&M.state!=='break'){ M.state='chase'; M.repath=0; M.tired=0; }
  } else if(M.state==='chase'){
    if(M.summoned>0){ M.lost=0; M.lk=pt; }
    M.lost+=dt;
    if(M.lost>=3.0){ M.state='search'; M.tired=0; M.path=astar(mt,M.lk); M.pi=0; }
  }

  // 판단
  M.repath-=dt;
  if(M.state==='chase'){
    M.tired+=dt;                                  // 오래 쫓으면 숨이 찬다
    // 길 끝에 닿으면 기다리지 않고 바로 다시 찾는다 (예전: 0.35초마다만 찾아서, 가까이 와서는 한 박자씩 멈춰 섰다)
    if(M.repath<=0 || M.pi>=M.path.length){ M.path=astar(mt,pt); M.pi=0; M.repath=0.35; }
  } else if(M.state==='break'){
    if(!M.plank||planks.indexOf(M.plank)<0){ M.plank=null; M.state='chase'; M.repath=0; }
    else{
      M.ptimer-=dt;
      if(M.ptimer<=0){
        M.ptimer=0.85; M.plank.hp--; sThud(); shake=Math.max(shake,0.35); fxPlankHit(M.plank, M.plank.hp<=0);
        toast('목재가 부서지고 있다!');
        if(M.plank.hp<=0){ planks.splice(planks.indexOf(M.plank),1); M.plank=null;
          M.state='chase'; M.repath=0; }
      }
      return;
    }
  } else if(M.pi>=M.path.length){
    if(M.state==='guard') M.path=astar(mt,rndNear(nest,3));
    else if(M.state==='search') M.path=astar(mt,Math.random()<0.6?rndNear(M.lk,4):rndOpen());
    else M.path=astar(mt,rndOpen());
    M.pi=0;
  }

  moveMonster(dt);
  touchPlayer();
}

function moveMonster(dt){
  const M=monster;
  // 추격 중 같은 칸·바로 옆 칸이면 칸 중심이 아니라 플레이어에게 곧장 덮친다
  if(M.state==='chase'){
    const mt=w2t(M.x,M.y), pt=w2t(player.x,player.y);
    if(Math.abs(mt[0]-pt[0])+Math.abs(mt[1]-pt[1])<=1 && !plankAt(pt[0],pt[1])){
      let sp=SPD_CHASE+(M.enraged?ENRAGE:0);
      if(M.summoned>0) sp*=1.08;
      if(M.tired>6) sp*=Math.max(0.80, 1-(M.tired-6)*0.05);
      const ddx=player.x-M.x, ddy=player.y-M.y, dd=Math.hypot(ddx,ddy);
      if(dd>0.5){ const st=Math.min(dd, sp*dt); M.x+=ddx/dd*st; M.y+=ddy/dd*st;
        if(Math.abs(ddx)>0.3) M.flip=ddx<0; M.mx=ddx; M.my=ddy; M.anim=(M.anim||0)+dt*9; }
      return;
    }
  }
  if(M.pi>=M.path.length) return;
  const nx=M.path[M.pi];
  const pl=plankAt(nx[0],nx[1]);
  if(pl){ M.plank=pl; M.state='break'; M.ptimer=0.25; return; }
  const [gx,gy]=tw(nx[0],nx[1]);
  let sp=(M.state==='chase'?SPD_CHASE:M.state==='search'?SPD_SEARCH:SPD_PATROL)+(M.enraged?ENRAGE:0);
  if(M.summoned>0) sp*=1.08;
  if(M.tired>6) sp*=Math.max(0.80, 1-(M.tired-6)*0.05);   // 8초 넘게 쫓으면 숨이 차서 걷기보다 조금 느려진다
  const ddx=gx-M.x, ddy=gy-M.y, dd=Math.hypot(ddx,ddy);
  if(Math.abs(ddx)>0.3) M.flip=ddx<0;
  if(dd>0.3){ M.mx=ddx; M.my=ddy; M.anim=(M.anim||0)+dt*(M.state==='chase'?9:6); }
  if(dd<=sp*dt){ M.x=gx; M.y=gy; M.pi++; }
  else { M.x+=ddx/dd*sp*dt; M.y+=ddy/dd*sp*dt; }
}

function touchPlayer(){
  const M=monster;
  if(Math.hypot(player.x-M.x,player.y-M.y)<10*K && player.inv<=0){
    player.hp--; player.inv=2.2; M.stagger=1.8; sHurt(); shake=1; flash=1; fxHit(); stats.hits++;
    const n=Math.hypot(player.x-M.x,player.y-M.y)||1;
    player.knock=0.2; player.kx=(player.x-M.x)/n*140*K; player.ky=(player.y-M.y)/n*140*K;
    if(player.hp<=0) lose();
  }
}

function los(a,b){
  let x=a[0],y=a[1];
  const dx=Math.abs(b[0]-a[0]), dy=Math.abs(b[1]-a[1]);
  const sx=a[0]<b[0]?1:-1, sy=a[1]<b[1]?1:-1;
  let err=dx-dy, guard=0;
  while(guard++<600){
    if(x===b[0]&&y===b[1]) return true;
    if(!(x===a[0]&&y===a[1])&&isWall(x,y)) return false;
    const e2=err*2;
    if(e2>-dy){ err-=dy; x+=sx; }
    if(e2<dx){ err+=dx; y+=sy; }
  }
  return false;
}
function rndOpen(){
  for(let i=0;i<40;i++){
    const x=(Math.random()*GW)|0, y=(Math.random()*GH)|0;
    if(!isWall(x,y)&&!(x===exitT[0]&&y===exitT[1])) return [x,y];
  }
  return nest;
}
function rndNear(c,r){
  for(let i=0;i<40;i++){
    const x=c[0]+((Math.random()*(2*r+1))|0)-r, y=c[1]+((Math.random()*(2*r+1))|0)-r;
    if(inB(x,y)&&!wall[x][y]) return [x,y];
  }
  return c;
}

function updateHostage(dt){
  if(!hostage.following) return;
  const tr=hostage.trail;
  if(!tr.length||Math.hypot(tr[tr.length-1][0]-player.x,tr[tr.length-1][1]-player.y)>2.5*K)
    tr.push([player.x,player.y]);
  if(tr.length>400) tr.shift();
  if(tr.length<=7){ hostage.moving=false; return; }
  const g=tr[0], dx=g[0]-hostage.x, dy=g[1]-hostage.y, d=Math.hypot(dx,dy);
  hostage.moving = d>0.5;
  if(d>0.5){ hostage.fx=dx/d; hostage.fy=dy/d; hostage.anim=(hostage.anim||0)+dt*9; }
  const sp=10.5*U;
  if(d<=sp*dt){ hostage.x=g[0]; hostage.y=g[1]; tr.shift(); }
  else { hostage.x+=dx/d*sp*dt; hostage.y+=dy/d*sp*dt; }
}

// ════════════════════════════════════════════════════════════
//  그리기 — 힉스필드 설정화에서 추출한 도트 에셋 사용
// ════════════════════════════════════════════════════════════
let camX=0, camY=0;
const tnow=()=>performance.now();

function drawC(n,cx,cy,flip,alpha,scale){
  const im=IMG[n]; if(!im||!im.width) return;
  const sc=scale||1, w=im.width*sc, h=im.height*sc;
  const x=Math.round(cx-w/2-camX), y=Math.round(cy-h/2-camY);
  if(x>VW||y>VH||x+w<0||y+h<0) return;
  const a=(alpha!==undefined&&alpha<1);
  if(a){ ctx.save(); ctx.globalAlpha=alpha; }
  if(flip){ ctx.save(); ctx.translate(x+w,y); ctx.scale(-1,1); ctx.drawImage(im,0,0,w,h); ctx.restore(); }
  else ctx.drawImage(im,x,y,w,h);
  if(a) ctx.restore();
}
// 캐릭터는 발끝을 기준으로 세운다 (몸이 윗칸으로 겹쳐 올라가는 3/4 시점)
function drawFeet(n,fx,fy,flip,alpha){
  const im=IMG[n]; if(!im) return;
  drawC(n,fx,fy-im.height/2,flip,alpha);
}
function footShadow(fx,fy,rw){
  ctx.fillStyle='rgba(0,0,0,.4)';
  ctx.beginPath(); ctx.ellipse(Math.round(fx-camX),Math.round(fy-camY),rw,rw*0.34,0,0,6.3); ctx.fill();
}
function hash2(x,y){ let h=(x*374761393+y*668265263)|0; h=Math.imul(h^(h>>>13),1274126177); return ((h^(h>>>16))>>>0)/4294967295; }
function floorVariant(tx,ty){
  const r=hash2(tx,ty);
  if(r<0.55) return 0;
  if(r<0.95) return 1+((hash2(ty+7,tx+3)*4)|0);
  return 5;
}
const FOOT = 0.32;   // 타일 중심에서 발끝까지 (타일 비율)

// 강조 테두리 맥박 (금색 = 주울 수 있음, 붉은색 = 위험)
const hlPulse=()=>0.55+0.45*Math.sin(tnow()/230);
// (예전) 상호작용 오브젝트 표시: 바닥 고리 + 화살표 — 지금은 쓰지 않음
function interactMarker(x,y,h){
  const k=(Math.sin(tnow()/260)+1)/2;
  const gx=Math.round(x-camX), gy=Math.round(y-camY);
  ctx.strokeStyle='rgba(255,210,90,'+(0.45+k*0.45).toFixed(2)+')'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(gx,gy+6,11+k*3,4.5+k*1.2,0,0,6.3); ctx.stroke();
  const ay=Math.round(gy-h/2-9-Math.abs(Math.sin(tnow()/220))*4);
  ctx.fillStyle='#16151c'; ctx.beginPath(); ctx.moveTo(gx-5,ay-1); ctx.lineTo(gx+5,ay-1); ctx.lineTo(gx,ay+5); ctx.fill();
  ctx.fillStyle='#fff4c8'; ctx.beginPath(); ctx.moveTo(gx-3.5,ay); ctx.lineTo(gx+3.5,ay); ctx.lineTo(gx,ay+3.5); ctx.fill();
}
function hazardGlow(x,y){
  const k=(Math.sin(tnow()/400)+1)/2;
  ctx.strokeStyle='rgba(255,70,50,'+(0.25+k*0.3).toFixed(2)+')'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(Math.round(x-camX),Math.round(y-camY),14,12,0,0,6.3); ctx.stroke();
}

// 방향(아래 d · 위 u · 옆 s) × 걷기 4프레임. 옆모습은 오른쪽을 보고 그려져 있어 왼쪽은 뒤집는다.
// 캐릭터별 걷기 프레임 수와 '서 있는 자세'(다리를 모은 프레임)
const WALK = {
  hunter: {img:'hunter6', n:6, idle:{"d": 2, "u": 0, "s": 2}},
  maiden: {img:'maiden',  n:4, idle:{d:0,u:0,s:0}},
  beast:  {img:'beast',   n:4, idle:{d:0,u:0,s:0}},
};
function walkName(prefix, fx, fy, frame){
  const side=Math.abs(fx)>Math.abs(fy)+0.01;
  const d= side?'s':(fy<0?'u':'d');
  const w=WALK[prefix];
  const f= frame===null ? w.idle[d] : ((frame%w.n)+w.n)%w.n;
  return [w.img+'_'+d+f, side&&fx<0];
}
function hostageSprite(){
  if(!hostage.rescued){
    const near=Math.hypot(hostage.x-player.x,hostage.y-player.y)<=12*K;
    const struggling = hostage.locked || (near && wantUse() && hostage.prog>0);
    return [struggling?'maiden_struggle':'maiden_lying', false];
  }
  const moving = hostage.following && hostage.moving;
  return walkName('maiden', hostage.fx, hostage.fy, moving?Math.floor(hostage.anim):null);
}
function beastSprite(){
  const M=monster;
  if(M.state==='stun') return ['beast_sleep', M.flip];
  if(M.state==='eat') return ['beast_eat', false];
  return walkName('beast', M.mx, M.my, Math.floor(M.anim||0));
}
const HUNTER_STRIDE=9.5;   // 그림 한 장당 이동 거리(px) — 걷기 약 11.5장/초, 달리기 약 15.5장/초
function hunterSprite(){
  const moving=player.spd>12 && !(player.knock>0);
  const side=Math.abs(player.fx)>Math.abs(player.fy)+0.01;
  if(player.aim>0 && side) return ['hunter_aim', player.fx<0];
  // 6프레임이라 예전(4프레임)보다 1.5배 빨리 넘겨 보폭 속도를 맞춘다
  return walkName('hunter', player.fx, player.fy, moving?Math.floor(player.bob):null);
}

function draw(){
  camX = player? (CAM.ready? CAM.x : player.x-VW/2) : 0;
  camY = player? (CAM.ready? CAM.y : player.y-VH/2) : 0;
  camX = Math.max(-T/2, Math.min(GW*T-VW+T/2, camX));
  camY = Math.max(-T/2, Math.min(GH*T-VH+T/2, camY));
  if(shake>0){ camX+=(Math.random()-0.5)*shake*3*K; camY+=(Math.random()-0.5)*shake*3*K; }
  // 카메라를 정수 픽셀에 맞춘다 — 소수점이면 배경과 캐릭터가 따로 반올림되어 1px씩 떨린다
  camX=Math.round(camX); camY=Math.round(camY);

  ctx.fillStyle='#08080c'; ctx.fillRect(0,0,VW,VH);
  if(phase==='title'||!player||!assetsReady) return;

  // ── 타일: 구역마다 다른 벽·바닥 ──
  const x0=Math.max(0,Math.floor(camX/T)), x1=Math.min(GW-1,Math.ceil((camX+VW)/T));
  const y0=Math.max(0,Math.floor(camY/T)), y1=Math.min(GH-1,Math.ceil((camY+VH)/T));
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++){
    const sx=Math.round(tx*T-camX), sy=Math.round(ty*T-camY);
    const rk=REGION_KEY[region(tx,ty)];
    if(wall[tx][ty]){
      const faceDown = ty<GH-1 && !wall[tx][ty+1];
      let wn=rk+(faceDown?'_wallface':'_walltop');
      if(rk==='bone' && hash2(tx*3+1,ty*5+2)>0.25) wn+='_plain';   // 해골 부조는 가끔만
      ctx.drawImage(IMG[wn],sx,sy);
    }else{
      ctx.drawImage(IMG[rk+'_floor'+floorVariant(tx,ty)],sx,sy);
      if(isWall(tx,ty-1)){ ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(sx,sy,T,3);
                           ctx.fillStyle='rgba(0,0,0,.22)'; ctx.fillRect(sx,sy+3,T,5); }
      ctx.fillStyle='rgba(0,0,0,.2)';
      if(isWall(tx-1,ty)) ctx.fillRect(sx,sy,4,T);
      if(isWall(tx+1,ty)) ctx.fillRect(sx+T-4,sy,4,T);
    }
  }

  // ── 출구 ──
  {
    const sx=Math.round(exitT[0]*T-camX), sy=Math.round(exitT[1]*T-camY);
    ctx.fillStyle='#050507'; ctx.fillRect(sx+3,sy+3,T-6,T-6);
    if(exitOpen){
      const k=(Math.sin(tnow()/300)+1)/2;
      ctx.fillStyle='rgba(140,232,176,'+(0.35+k*0.3).toFixed(2)+')'; ctx.fillRect(sx+6,sy+6,T-12,T-12);
    }else{
      ctx.fillStyle='#5b606a';
      for(let i=0;i<4;i++) ctx.fillRect(sx+7+i*5,sy+4,2,T-8);
      ctx.fillRect(sx+5,sy+9,T-10,2); ctx.fillRect(sx+5,sy+T-11,T-10,2);
    }
  }

  // ── 바닥 오브젝트 (구덩이 · 상자 · 소품) ──
  for(const q of pits){ const [x,y]=tw(q.tx,q.ty); drawC('pit_hl',x,y,false,0.35+0.35*Math.sin(tnow()/400)+0.3); drawC('pit',x,y); }
  for(const c of chests){
    const [x,y]=tw(c.tx,c.ty);
    if(!c.opened) drawC('chest_hl',x,y+2,false,hlPulse());
    drawC(c.opened?'chest_open':'chest',x,y+2,false,c.opened?0.55:1);
  }
  for(const p of props){ const [x,y]=tw(p.t[0],p.t[1]); drawC(p.s,x,y+(p.dy||0)); }
  for(const tr of torches){
    const [x,y]=tw(tr.t[0],tr.t[1]);
    const n=(Math.sin(tnow()/180+tr.ph)+1)/2;
    ctx.fillStyle='rgba(255,160,60,'+(0.07+n*0.05).toFixed(3)+')';
    ctx.beginPath(); ctx.arc(Math.round(x-camX),Math.round(y-camY+6),26+n*4,0,6.3); ctx.fill();
    drawC('torch',x,y+2);
  }
  for(const p of planks){ const [x,y]=tw(p.tx,p.ty); drawC(p.hp>=PLANK_HP?'barricade':'barricade_broken',x,y); }
  for(const b of baits){
    const k=(Math.sin(tnow()/220)+1)/2;
    ctx.strokeStyle='rgba(255,140,120,'+(0.25+k*0.35).toFixed(2)+')';
    ctx.lineWidth=2; ctx.beginPath(); ctx.arc(Math.round(b.x-camX),Math.round(b.y-camY),12+k*6,0,6.3); ctx.stroke();
    drawC('meat',b.x,b.y);
  }
  const ICON={planks:['plank_item',1],crossbow:['crossbow',1],bolts:['bolts',1],meat:['meat',1],key:['key',1]};
  for(const p of pickups){
    const bob=Math.round(Math.sin(tnow()/450+p.ph)*2);
    const [n,sc]=ICON[p.s]||[p.s,1];
    if(IMG[n+'_hl']) drawC(n+'_hl',p.x,p.y+bob,false,hlPulse());
    drawC(n,p.x,p.y+bob,false,1,sc);
  }

  // ── 캐릭터: 아래쪽에 있는 것이 앞에 오도록 y 정렬 ──
  const ents=[];
  ents.push({y:hostage.y, d:()=>{
    const [n,f]=hostageSprite(); const fy=hostage.y+T*FOOT;
    footShadow(hostage.x,fy,9); drawFeet(n,hostage.x,fy,f);
  }});
  ents.push({y:monster.y, d:()=>{
    const [n,f]=beastSprite(); const fy=monster.y+T*FOOT;
    footShadow(monster.x,fy,17); drawFeet(n,monster.x,fy,f);
    const gx=Math.round(monster.x-camX), top=Math.round(fy-IMG[n].height-camY);
    if(monster.state==='chase'){ ctx.fillStyle='#ff4438'; ctx.fillRect(gx-2,top-12,4,9); ctx.fillRect(gx-2,top-1,4,3); }
    if(monster.state==='bait'){ ctx.fillStyle='#ffb27a'; ctx.fillRect(gx-2,top-12,4,9); ctx.fillRect(gx-2,top-1,4,3); }
  }});
  ents.push({y:player.y+6, d:()=>{
    const [n,f]=hunterSprite();
    const fy=player.y+T*FOOT;
    footShadow(player.x,fy,9);
    if(!(player.inv>0 && ((tnow()/80)|0)%2)) drawFeet(n,player.x,fy,f);
  }});
  ents.sort((a,b)=>a.y-b.y);
  for(const e of ents) e.d();

  // 날아가는 화살
  for(const d of darts){
    const gx=Math.round(d.x-camX), gy=Math.round(d.y-camY);
    const n=Math.hypot(d.vx,d.vy)||1, ux=d.vx/n, uy=d.vy/n;
    ctx.strokeStyle='#e8e2d0'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(gx-ux*7,gy-uy*7); ctx.lineTo(gx+ux*5,gy+uy*5); ctx.stroke();
    ctx.fillStyle='#9ec8ff'; ctx.fillRect(gx+ux*5-1,gy+uy*5-1,3,3);
  }

  lightLayer();
  drawFx();
  drawGuides();

  // 조준 점선
  if(player.bow && player.ammo>0){
    const n=Math.hypot(player.fx,player.fy)||1, ux=player.fx/n, uy=player.fy/n;
    for(let i=1;i<=12;i++){
      const px=player.x+ux*i*4.8*K, py=player.y+uy*i*4.8*K;
      const [tx,ty]=w2t(px,py);
      if(isWall(tx,ty)||plankAt(tx,ty)) break;
      const fade=1-i/13, blink=0.75+Math.sin(tnow()/125-i*0.5)*0.25;
      ctx.fillStyle='rgba(158,235,255,'+(fade*0.9*blink).toFixed(2)+')';
      ctx.fillRect(Math.round(px-camX-1.5),Math.round(py-camY-1.5),3,3);
    }
  }

  // 구출 게이지 — 인질 머리 위에 3칸
  if(!hostage.rescued && Math.hypot(hostage.x-player.x,hostage.y-player.y)<30*K){
    const cw=14, gap=3, tot=RESCUE_STAGES*cw+(RESCUE_STAGES-1)*gap;
    const x=Math.round(hostage.x-camX-tot/2), y=Math.round(hostage.y-camY-30);
    for(let i=0;i<RESCUE_STAGES;i++){
      const bx=x+i*(cw+gap);
      ctx.fillStyle='rgba(0,0,0,.75)'; ctx.fillRect(bx-1,y-1,cw+2,7);
      const f= i<hostage.stage?1 : i===hostage.stage?Math.min(1,hostage.prog):0;
      if(f>0){ ctx.fillStyle=i<hostage.stage?'#8ce8b0':'#ffd23d'; ctx.fillRect(bx,y,Math.round(cw*f),5); }
    }
    if(hostage.cool>0){
      // 다음 칸이 열릴 때까지 남은 시간 (회색 막대가 줄어든다)
      ctx.fillStyle='rgba(160,160,170,.8)'; ctx.fillRect(x, y+8, Math.round(tot*hostage.cool/RESCUE_COOL), 2);
      ctx.fillStyle='#ff8a8a'; ctx.font='10px Galmuri9'; ctx.textAlign='center';
      ctx.fillText('괴물이 온다! 피해라', Math.round(hostage.x-camX), y-5);
    } else if(hostage.locked){
      ctx.fillStyle='#ffd88a'; ctx.font='10px Galmuri9'; ctx.textAlign='center';
      ctx.fillText('다시 꾹 누르기', Math.round(hostage.x-camX), y-5);
    }
  }
  if(hostage.rescued && !hostage.following){
    ctx.fillStyle='#ffb27a'; ctx.font='10px Galmuri9'; ctx.textAlign='center';
    ctx.fillText('인질을 데리러 가라', VW/2, 16);
  }

  // 괴물 근접 경고 · 피격 플래시 · 낙하 암전
  const md=Math.hypot(player.x-monster.x,player.y-monster.y);
  if(md<9*U){ const k=1-md/(9*U); ctx.fillStyle='rgba(180,20,20,'+(k*k*0.22).toFixed(3)+')'; ctx.fillRect(0,0,VW,VH); }
  if(flash>0){ ctx.fillStyle='rgba(200,0,0,'+(flash*0.4).toFixed(3)+')'; ctx.fillRect(0,0,VW,VH); }
  if(player.fall>0){ ctx.fillStyle='rgba(0,0,0,'+Math.min(0.85,player.fall).toFixed(2)+')'; ctx.fillRect(0,0,VW,VH); }

  drawHUD();
  drawSlotFlash();
  drawFlyers();
}

const MINI_FLOOR=['#7d93b8','#9a6a4a','#5f8a66','#8a8577','#6e4048'];
function drawHUD(){
  // 체력 · 스태미나
  for(let i=0;i<player.hpMax;i++){
    ctx.save(); if(i>=player.hp) ctx.globalAlpha=0.22;
    ctx.drawImage(IMG.heart, 6+i*16, VH-19); ctx.restore();
  }
  ctx.fillStyle='rgba(0,0,0,.65)'; ctx.fillRect(6,VH-27,64,6);
  ctx.fillStyle=player.st<20?'#ff8a70':'#8cc9e8'; ctx.fillRect(7,VH-26,62*player.st/100,4);

  // 열쇠 조각 (4칸) — 아이템 수량은 조작 버튼에 표시된다
  {
    const SZ=18, GAP=2, x0=VW-6-FRAGMENTS*(SZ+GAP)+GAP, y0=VH-SZ-6;
    for(let i=0;i<FRAGMENTS;i++){
      const x=x0+i*(SZ+GAP), got=i<player.frags;
      ctx.fillStyle=got?'rgba(217,184,97,.9)':'rgba(74,70,58,.55)'; ctx.fillRect(x,y0,SZ,SZ);
      ctx.fillStyle='rgba(10,10,14,.92)'; ctx.fillRect(x+1,y0+1,SZ-2,SZ-2);
      const im=IMG[player.key?'key':'frag'+(i+1)];
      if(im){ const sc=Math.min((SZ-4)/im.width,(SZ-4)/im.height), w=Math.round(im.width*sc), h=Math.round(im.height*sc);
        ctx.save(); ctx.globalAlpha=got?1:0.2; ctx.drawImage(im,x+((SZ-w)>>1),y0+((SZ-h)>>1),w,h); ctx.restore(); }
    }
    ctx.fillStyle='#cfc6b0'; ctx.font='10px Galmuri9'; ctx.textAlign='right';
    ctx.fillText(player.key?'열쇠 완성':'열쇠 조각', VW-6, y0-3);
  }

  // 미니맵 — 구역마다 다른 색
  const S=2, mx=VW-GW*S-6, my=6;
  ctx.fillStyle='rgba(8,8,12,.42)'; ctx.fillRect(mx-2,my-2,GW*S+4,GH*S+4);
  for(let y=0;y<GH;y++) for(let x=0;x<GW;x++){
    if(!seen[x][y]) continue;
    ctx.fillStyle=wall[x][y]?'#1c1a22':MINI_FLOOR[region(x,y)];
    ctx.fillRect(mx+x*S,my+y*S,S,S);
  }
  for(const c of chests){ if(!seen[c.tx][c.ty]) continue;
    ctx.fillStyle=c.opened?'#4a453a':'#ffd66e'; ctx.fillRect(mx+c.tx*S,my+c.ty*S,S,S); }
  for(const q of pits){ if(!seen[q.tx][q.ty]) continue;
    ctx.fillStyle='#000'; ctx.fillRect(mx+q.tx*S,my+q.ty*S,S,S); }
  if(seen[exitT[0]][exitT[1]]||phase==='escape'){ ctx.fillStyle=exitOpen?'#8ce8b0':'#b05050';
    ctx.fillRect(mx+exitT[0]*S-1,my+exitT[1]*S-1,S+2,S+2); }
  const goal=currentGoal();
  if(goal){ const g=w2t(goal.x,goal.y); const k=((tnow()/250)|0)%2;
    ctx.fillStyle=k?'#ffc43c':'#fff0a0'; ctx.fillRect(mx+g[0]*S-1,my+g[1]*S-1,S+2,S+2); }
  const p=w2t(player.x,player.y); ctx.fillStyle='#ffffff'; ctx.fillRect(mx+p[0]*S-1,my+p[1]*S-1,S+2,S+2);
}

const INTRO=[
  {t:'짐승인 줄 알았다.',                         img:'beast_s1', dark:true},

  {t:'눈을 떴을 때, 주위엔 뼈뿐이었다.',            img:'skull_d'},
