let introI=-1, introTimer=0;
function playIntro(){
  if(!assetsReady) return;
  const el=document.getElementById('intro'); if(!el||!el.classList){ start(); return; }
  el.style.backgroundImage='url('+IMG_SRC.title+')';
  el.classList.remove('hide'); introI=-1; introNext();
}
// 대사창: 한 글자씩 타자기처럼. 치는 중에 누르면 문장 전체를 바로 보이고, 한 번 더 누르면 다음 문장.
let introType=null;
function introTyping(){ return !!introType; }
function introFinishTyping(){
  if(!introType) return false;
  clearInterval(introType); introType=null;
  const box=document.getElementById('introLine'); box.textContent=INTRO[introI].t; box.classList.remove('typing');
  return true;
}
function typeLine(box,text){
  clearInterval(introType); introType=null; box.classList.remove('typing');
  const reduce=window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ box.textContent=text; return; }
  let i=0; box.textContent=''; box.classList.add('typing');
  introType=setInterval(()=>{ i++; box.textContent=text.slice(0,i);
    if(i%3===1 && text[i-1]!==' ' && text[i-1]!=='\n') sTick();
    if(i>=text.length){ clearInterval(introType); introType=null; box.classList.remove('typing'); } },30);
}
function introNext(){
  if(introFinishTyping()) return;           // 치는 중이면 먼저 다 보여 준다
  clearTimeout(introTimer);
  introI++;
  if(introI>=INTRO.length){ introEnd(); return; }
  const s=INTRO[introI], box=document.getElementById('introLine'), im=document.getElementById('introImg');
  box.classList.remove('show'); im.classList.remove('show');
  setTimeout(()=>{
    if(introI<0) return;
    box.classList.toggle('gold',!!s.gold);
    im.src=IMG_SRC[s.img]; im.classList.toggle('dark',!!s.dark);
    box.classList.add('show'); im.classList.add('show');
    typeLine(box,s.t);
    const dots=document.getElementById('introDots');
    if(dots) dots.textContent=INTRO.map((_,i)=>i===introI?'■':'□').join(' ');
    if(s.roar){ sRoar(); const st=document.getElementById('intro'); st.classList.add('quake'); setTimeout(()=>st.classList.remove('quake'),700); }
  },180);
  introTimer=setTimeout(()=>{ introFinishTyping(); introNext(); }, 3600);   // 자동 넘김: 치는 중이어도 다음 문장으로
}
function introEnd(){
  clearTimeout(introTimer); clearInterval(introType); introType=null; introI=-1;
  const el=document.getElementById('intro'); if(el&&el.classList) el.classList.add('hide');
  start();
}

// ════════════════════════════════════════════════════════════
//  연출 층 — 조명 · 파티클 · 카메라 · 타격감
//  게임 규칙(update)과 분리되어 있다. loop() 에서만 돌고, 시뮬레이션 테스트에는 영향이 없다.
// ════════════════════════════════════════════════════════════
const FX = { parts:[], floats:[], flyers:[], amb:[], stepAcc:0, stepSide:0,
             lastMState:'', lastPhase:'', hitstop:0, slotFlash:[0,0,0,0], dt:1/60, monStep:0 };
const CAM = { x:0, y:0, ready:false };
const FX_CAP = 500;

function fxReset(){
  FX.parts.length=0; FX.floats.length=0; FX.flyers.length=0; FX.amb.length=0;
  FX.stepAcc=0; FX.lastMState=''; FX.hitstop=0; FX.slotFlash=[0,0,0,0]; CAM.ready=false;
}
const rnd=(a,b)=>a+Math.random()*(b-a);
function burst(x,y,n,o){
  o=o||{};
  for(let i=0;i<n;i++){
    if(FX.parts.length>=FX_CAP) FX.parts.shift();
    const a=o.ang!==undefined ? o.ang+rnd(-(o.spread||3.2),(o.spread||3.2))/2 : rnd(0,6.283);
    const sp=rnd(o.smin||20,o.smax||90);
    FX.parts.push({x:x+rnd(-(o.jx||0),(o.jx||0)), y:y+rnd(-(o.jy||0),(o.jy||0)),
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-(o.up||0), g:o.g===undefined?0:o.g, drag:o.drag||2.5,
      life:rnd(o.lmin||0.3,o.lmax||0.7), max:0, size:o.size||2, col:o.cols[(Math.random()*o.cols.length)|0],
      glow:!!o.glow, shrink:o.shrink!==false});
    FX.parts[FX.parts.length-1].max=FX.parts[FX.parts.length-1].life;
  }
}
function floatText(x,y,text,col,img){
  if(FX.floats.length>40) FX.floats.shift();
  FX.floats.push({x,y,text,col:col||'#fff2cc',img,life:1.1,max:1.1});
}

// ── 구역별 색 ──
const AMBIENT = [ [14,20,40], [30,12,6], [6,20,16], [16,16,14], [28,6,10] ];   // 어둠의 색 (북·동·남·서·중앙)
const DUST    = [ ['#dfeaff','#b9cbe8'], ['#6b5a52','#8a6e5a'], ['#7fb8d8','#a8d8e8'], ['#b9ae92','#8f866f'], ['#8a4a48','#6b3a3a'] ];
let ambCol=[16,14,22];

// ── 프레임마다: 카메라 · 파티클 · 이벤트 감지 ──
function fxUpdate(dt){
  FX.dt=dt;
  if(!player) return;
  const playingNow=playing();

  // 카메라: 진행 방향을 살짝 앞질러 부드럽게 따라간다. 순간이동(구덩이·재시작)은 바로 맞춘다.
  const tx=player.x+player.vx*0.1-VW/2, ty=player.y+player.vy*0.1-VH/2;
  if(!CAM.ready || Math.hypot(tx-CAM.x,ty-CAM.y)>220){ CAM.x=tx; CAM.y=ty; CAM.ready=true; }
  else { const k=1-Math.exp(-10*dt); CAM.x+=(tx-CAM.x)*k; CAM.y+=(ty-CAM.y)*k; }

  // 구역 어둠 색을 서서히 바꾼다
  const rg=region(...w2t(player.x,player.y)), want=AMBIENT[rg];
  for(let i=0;i<3;i++) ambCol[i]+=(want[i]-ambCol[i])*(1-Math.exp(-2*dt));

  if(playingNow){
    // 걸음 먼지 · 발소리
    const sp=player.spd||0;
    if(sp>20 && player.fall<=0){
      FX.stepAcc+=sp*dt;
      const stride=player.run?30:24;
      if(FX.stepAcc>stride){
        FX.stepAcc=0; FX.stepSide^=1;
        const fy=player.y+T*FOOT-2;
        burst(player.x+(FX.stepSide?-3:3), fy, player.run?3:2,
          {cols:DUST[rg], smin:6, smax:22, up:8, lmin:.25, lmax:.5, size:2, drag:4});
        sStep(FX.stepSide, rg);
      }
    }
    // 괴물: 쫓기 시작하면 느낌표 · 걸음 진동
    const M=monster;
    if(M.state==='chase' && FX.lastMState!=='chase' && FX.lastMState!==''){
      floatText(M.x, M.y-44, '!', '#ff5040'); sAlert(); shake=Math.max(shake,0.35);
    }
    FX.lastMState=M.state;
    const md=Math.hypot(M.x-player.x,M.y-player.y);
    if((M.state==='chase'||M.state==='search'||M.state==='guard'||M.state==='patrol'||M.state==='bait') && md<T*8){
      FX.monStep+=dt*(M.state==='chase'?2.6:1.8);
      if(FX.monStep>1){ FX.monStep=0; sMonStep(1-md/(T*8));
        burst(M.x,M.y+T*FOOT,3,{cols:DUST[region(...w2t(M.x,M.y))],smin:10,smax:30,up:6,lmin:.3,lmax:.6,size:3,drag:4}); }
    }
    if(M.state==='stun' && Math.random()<dt*10)
      burst(M.x+rnd(-12,12),M.y-30,1,{cols:['#9ec8ff','#d8ecff'],smin:4,smax:12,up:14,lmin:.6,lmax:1,size:2,glow:true,drag:1});
  }

  // 구역마다 떠다니는 것들 (화면 안에서만)
  if(FX.amb.length<70 && Math.random()<dt*40){
    const x=CAM.x+rnd(-20,VW+20), y=CAM.y+rnd(-20,VH+20), t=w2t(x,y);
    if(inB(t[0],t[1]) && !wall[t[0]][t[1]]){
      const r=region(t[0],t[1]);
      const A=[ {vx:rnd(-6,6),vy:rnd(10,22),size:rnd(1,2.2)|0||1,col:'#e8f2ff',glow:false,sway:1.4,life:rnd(3,5)},     // 눈발
                {vx:rnd(-5,5),vy:rnd(-26,-12),size:1,col:'#ffa040',glow:true,sway:2.5,life:rnd(1.5,2.6)},             // 불티
                {vx:rnd(-4,4),vy:rnd(-4,4),size:1,col:'#a8ff9a',glow:true,sway:0.8,life:rnd(2.5,4)},                   // 반딧불
                {vx:rnd(-3,3),vy:rnd(-3,3),size:1,col:'#c9c2a8',glow:false,sway:0.6,life:rnd(3,5)},                    // 먼지
                {vx:rnd(-4,4),vy:rnd(-14,-6),size:rnd(1,2.4)|0||1,col:'#ff5a46',glow:true,sway:1.2,life:rnd(2,3.2)} ][r];
      A.x=x; A.y=y; A.max=A.life; A.ph=rnd(0,6.28); FX.amb.push(A);
    }
  }
  for(let i=FX.amb.length-1;i>=0;i--){ const a=FX.amb[i]; a.life-=dt;
    a.x+=(a.vx+Math.sin(a.ph+a.life*a.sway)*6)*dt; a.y+=a.vy*dt;
    if(a.life<=0 || a.x<CAM.x-60 || a.x>CAM.x+VW+60 || a.y<CAM.y-60 || a.y>CAM.y+VH+60) FX.amb.splice(i,1); }

  for(let i=FX.parts.length-1;i>=0;i--){ const p=FX.parts[i]; p.life-=dt;
    if(p.life<=0){ FX.parts.splice(i,1); continue; }
    const d=Math.exp(-p.drag*dt); p.vx*=d; p.vy=p.vy*d+p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }
  for(let i=FX.floats.length-1;i>=0;i--){ const f=FX.floats[i]; f.life-=dt; f.y-=22*dt; if(f.life<=0) FX.floats.splice(i,1); }
  for(let i=FX.flyers.length-1;i>=0;i--){ const f=FX.flyers[i]; f.t+=dt/f.dur;
    if(f.t>=1){ FX.slotFlash[f.slot]=0.6; sPick(1.5); FX.flyers.splice(i,1); } }
  for(let i=0;i<4;i++) if(FX.slotFlash[i]>0) FX.slotFlash[i]-=dt;

  // 단계가 바뀌면 큰 안내
  if(phase!==FX.lastPhase){
    const B={bow:['수면 석궁을 찾아라','괴물이 미로를 돌아다닌다'], rescue:['공주를 구출하라','한 칸 채울 때마다 괴물이 달려온다'],
             key:['열쇠 조각 4개','네 구역의 상자를 열어라'], escape:['탈출하라!','공주를 데리고 출구로']}[phase];
    if(B && FX.lastPhase!=='') showBanner(B[0],B[1]);
    FX.lastPhase=phase;
  }
}

// ── 게임 사건에 붙이는 연출 (규칙 코드에서 한 줄씩 부른다) ──
function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }
function fxHit(){
  FX.hitstop=0.09; buzz([60,30,60]);
  burst(player.x,player.y-10,14,{cols:['#ff5a5a','#ffb0a0','#ffffff'],smin:40,smax:130,lmin:.25,lmax:.5,size:2,drag:5});
  floatText(player.x,player.y-36,'-1 ♥','#ff7a80');
}
function fxPickup(p){
  const col={crossbow:'#9ec8ff',bolts:'#9ec8ff',meat:'#ff9a7a',planks:'#e0b070'}[p.s]||'#fff2cc';
  burst(p.x,p.y,12,{cols:[col,'#fff8d8'],smin:30,smax:90,lmin:.3,lmax:.6,size:2,glow:true,drag:4});
  const label={crossbow:'수면 석궁',bolts:'화살 +'+p.amt,meat:'미끼 +1',planks:'목재 +1'}[p.s]||'';
  floatText(p.x,p.y-24,label,col);
}
function fxChest(c){
  const [x,y]=tw(c.tx,c.ty); buzz(30);
  burst(x,y-6,26,{cols:['#ffd66e','#fff4b0','#ffb040'],smin:40,smax:150,up:40,g:120,lmin:.5,lmax:1,size:2,glow:true,drag:2});
  // 조각이 화면 오른쪽 아래 열쇠 칸으로 날아간다
  const slot=Math.min(3,player.frags-1);
  if(FX.flyers.length>8) FX.flyers.shift();
  FX.flyers.push({sx:x-camX, sy:y-camY-10, slot, t:0, dur:0.75, img:'frag'+(slot+1)});
  sChest();
}
function fxPlankPlace(tx,ty){ const [x,y]=tw(tx,ty);
  burst(x,y+8,10,{cols:['#8a6e5a','#b9ae92'],smin:20,smax:60,up:10,lmin:.3,lmax:.6,size:2,drag:4}); }
function fxPlankHit(pl,broken){ const [x,y]=tw(pl.tx,pl.ty);
  burst(x,y,broken?30:12,{cols:['#a97440','#8a5a2e','#5c3a1c','#d8b080'],smin:50,smax:broken?200:120,up:30,g:300,lmin:.4,lmax:.9,size:broken?3:2,drag:1.5,shrink:false});
  if(broken){ sBreak(); shake=Math.max(shake,0.7); } }
function fxDartTrail(d){ if(Math.random()<0.7) burst(d.x,d.y,1,{cols:['#9ec8ff','#d8ecff'],smin:2,smax:8,lmin:.2,lmax:.35,size:1.5,glow:true}); }
function fxStun(){ const M=monster;
  burst(M.x,M.y-14,30,{cols:['#9ec8ff','#d8ecff','#ffffff'],smin:40,smax:140,lmin:.4,lmax:.8,size:2,glow:true,drag:3});
  floatText(M.x,M.y-50,'Zzz','#9ec8ff'); }
function fxBaitEat(){ const M=monster;
  burst(M.x,M.y-6,14,{cols:['#c85b52','#a33b3b','#e8e0cc'],smin:30,smax:90,up:20,g:200,lmin:.3,lmax:.6,size:2,drag:2}); sCrunch(); }
function fxFall(px,py){
  buzz(160);
  burst(px,py,22,{cols:['#2a2830','#4a4638','#8a8578'],smin:20,smax:80,lmin:.4,lmax:.9,size:3,drag:3});
  burst(player.x,player.y,24,{cols:['#fff4c8','#ffd66e'],smin:20,smax:70,up:60,lmin:.5,lmax:1,size:2,glow:true,drag:2});
  sFall();
}
function fxWin(){ for(let i=0;i<5;i++) burst(player.x+rnd(-60,60),player.y-40,20,
  {cols:['#ffd66e','#8ce8b0','#9ec8ff','#ff9a7a'],smin:60,smax:200,up:80,g:220,lmin:.8,lmax:1.6,size:3,shrink:false,drag:1}); }

// ── 단계 안내 배너 (DOM) ──
let _bannerT=0;
function showBanner(title,sub){
  const b=document.getElementById('banner'); if(!b||!b.classList) return;
  b.innerHTML='<b>'+title+'</b><span>'+sub+'</span>';
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
  clearTimeout(_bannerT); _bannerT=setTimeout(()=>b.classList.remove('show'),2200);
  sBanner();
}

// ── 그리기: 조명 층 ──
let lightCv=null, lg=null, vigCv=null;
function lightLayer(){
  if(!lightCv || lightCv.width!==VW || lightCv.height!==VH){
    lightCv=document.createElement('canvas'); lightCv.width=VW; lightCv.height=VH; lg=lightCv.getContext('2d');
    vigCv=document.createElement('canvas'); vigCv.width=VW; vigCv.height=VH;
    const vg=vigCv.getContext('2d'), g=vg.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*0.35,VW/2,VH/2,Math.hypot(VW,VH)*0.58);
    g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.55)'); vg.fillStyle=g; vg.fillRect(0,0,VW,VH);
  }
  const t=tnow()/1000;
  const [r,gc,b]=ambCol.map(v=>v|0);
  lg.globalCompositeOperation='source-over';
  lg.clearRect(0,0,VW,VH);
  lg.fillStyle=`rgba(${r},${gc},${b},0.5)`; lg.fillRect(0,0,VW,VH);
  lg.globalCompositeOperation='destination-out';
  const hole=(x,y,rad,a)=>{ x-=camX; y-=camY; if(x<-rad||y<-rad||x>VW+rad||y>VH+rad) return;
    const g=lg.createRadialGradient(x,y,0,x,y,rad); g.addColorStop(0,`rgba(0,0,0,${a})`); g.addColorStop(1,'rgba(0,0,0,0)');
    lg.fillStyle=g; lg.fillRect(x-rad,y-rad,rad*2,rad*2); };
  const glows=[];
  hole(player.x,player.y-8,215,1);                                          // 사냥꾼의 랜턴
  for(const tr of torches){ const [x,y]=tw(tr.t[0],tr.t[1]); const f=0.85+0.15*Math.sin(t*9+tr.ph)*Math.sin(t*5.3+tr.ph*2);
    hole(x,y+6,78*f,0.95); glows.push([x,y+4,34*f,'255,150,60',0.22]); }
  for(const p of props) if(p.s==='brazier'){ const [x,y]=tw(p.t[0],p.t[1]); const f=0.9+0.1*Math.sin(t*7+p.t[0]);
    hole(x,y,96*f,1); glows.push([x,y-6,44*f,'255,130,50',0.28]); }
  for(const c of chests) if(!c.opened){ const [x,y]=tw(c.tx,c.ty); hole(x,y,44,0.7); glows.push([x,y,20,'255,210,110',0.16+0.08*Math.sin(t*3+c.reg)]); }
  for(const p of pickups){ hole(p.x,p.y,34,0.6); glows.push([p.x,p.y,14,'255,240,170',0.14]); }
  for(const d of darts){ hole(d.x,d.y,40,0.8); glows.push([d.x,d.y,12,'160,210,255',0.4]); }
  for(const bt of baits) glows.push([bt.x,bt.y,16,'255,120,100',0.18]);
  if(exitOpen){ const [x,y]=tw(exitT[0],exitT[1]); hole(x,y,90,1); glows.push([x,y,40,'140,232,176',0.3+0.1*Math.sin(t*3)]); }
  if(monster && monster.state!=='stun'){ const n=monster.state==='chase'?0.55:0.3;          // 어둠 속에서도 괴물 눈은 보인다
    glows.push([monster.x,monster.y+T*FOOT-34,10,'255,190,40',n]); }
  ctx.drawImage(lightCv,0,0);

  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(const [x0,y0,rad,col,a] of glows){ const x=x0-camX, y=y0-camY; if(x<-rad||y<-rad||x>VW+rad||y>VH+rad) continue;
    const g=ctx.createRadialGradient(x,y,0,x,y,rad); g.addColorStop(0,`rgba(${col},${a})`); g.addColorStop(1,`rgba(${col},0)`);
    ctx.fillStyle=g; ctx.fillRect(x-rad,y-rad,rad*2,rad*2); }
  // 떠다니는 것 (빛나는 것은 더하기)
  for(const a of FX.amb){ const k=Math.min(1,a.life/a.max*3, (a.max-a.life)*2);
    ctx.globalCompositeOperation=a.glow?'lighter':'source-over';
    ctx.globalAlpha=k*(a.glow?0.9:0.7); ctx.fillStyle=a.col;
    ctx.fillRect(Math.round(a.x-camX),Math.round(a.y-camY),a.size,a.size); }
  ctx.restore();
  ctx.drawImage(vigCv,0,0);
}

// ── 그리기: 파티클 · 떠오르는 글자 · 날아가는 조각 ──
function drawFx(){
  ctx.save();
  for(const p of FX.parts){ const k=p.life/p.max, s=p.shrink?Math.max(1,p.size*k+0.5):p.size;
    ctx.globalCompositeOperation=p.glow?'lighter':'source-over'; ctx.globalAlpha=Math.min(1,k*1.6);
    ctx.fillStyle=p.col; ctx.fillRect(Math.round(p.x-camX-s/2),Math.round(p.y-camY-s/2),s,s); }
  ctx.globalCompositeOperation='source-over';
  ctx.textAlign='center'; ctx.font='bold 12px Galmuri11';
  for(const f of FX.floats){ const k=f.life/f.max, pop=k>0.85?1+(k-0.85)*3:1;
    ctx.globalAlpha=Math.min(1,k*2.5);
    const x=Math.round(f.x-camX), y=Math.round(f.y-camY);
    if(f.text==='!'){ ctx.font=`30px Galmuri14`; ctx.fillStyle='#000'; ctx.fillText('!',x+1,y+2); ctx.fillStyle=f.col; ctx.fillText('!',x,y); ctx.font='bold 12px Galmuri11'; continue; }
    ctx.fillStyle='rgba(0,0,0,.8)'; ctx.fillText(f.text,x+1,y+1); ctx.fillStyle=f.col; ctx.fillText(f.text,x,y); }
  ctx.restore();
}
function drawFlyers(){
  ctx.save();
  // 열쇠 칸 위치 (drawHUD 와 같은 계산)
  const SZ=18, GAP=2, sx0=VW-6-FRAGMENTS*(SZ+GAP)+GAP, sy0=VH-SZ-6;
  for(const f of FX.flyers){ const e=1-Math.pow(1-f.t,3);
    const ex=sx0+f.slot*(SZ+GAP)+SZ/2, ey=sy0+SZ/2;
    const x=f.sx+(ex-f.sx)*e, y=f.sy+(ey-f.sy)*e-Math.sin(f.t*Math.PI)*40, im=IMG[f.img];
    if(im){ const s=1+Math.sin(f.t*Math.PI)*0.6; ctx.drawImage(im,Math.round(x-im.width*s/2),Math.round(y-im.height*s/2),im.width*s,im.height*s); } }
  ctx.restore();
}
function drawSlotFlash(){
  const SZ=18, GAP=2, sx0=VW-6-FRAGMENTS*(SZ+GAP)+GAP, sy0=VH-SZ-6;
  for(let i=0;i<4;i++) if(FX.slotFlash[i]>0){
    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=FX.slotFlash[i]/0.6;
    ctx.fillStyle='#ffd66e'; ctx.fillRect(sx0+i*(SZ+GAP)-2,sy0-2,SZ+4,SZ+4); ctx.restore(); }
}

// ════════════════════════════════════════════════════════════
//  길 안내 — 목표 방향 화살표(금색) · 화면 밖 괴물 경고(붉은색) · 첫 판 상황 힌트
// ════════════════════════════════════════════════════════════
function currentGoal(){
  const nextChest=nextChestTarget();
  return phase==='bow'? (pickups.find(p=>p.s==='crossbow')||null)
       : phase==='rescue'? {x:hostage.x,y:hostage.y}
       : (hostage.rescued&&!hostage.following)? {x:hostage.x,y:hostage.y}
       : (phase==='key'&&nextChest)? {x:(nextChest.tx+0.5)*T,y:(nextChest.ty+0.5)*T}
       : {x:(exitT[0]+0.5)*T,y:(exitT[1]+0.5)*T};
}
// 화면 가운데에서 (sx,sy) 쪽으로 그은 선이 안쪽 여백 m 의 테두리와 만나는 점
function edgePoint(sx,sy,m){
  const cx=VW/2, cy=VH/2, dx=sx-cx, dy=sy-cy;
  const top=m+8, bot=m+(WIDE?30:22);   // 아래: 체력·열쇠 칸·알림·키 안내를 피한다
  const tx = dx>0 ? (VW-m-cx)/dx : dx<0 ? (m-cx)/dx : Infinity;
  const ty = dy>0 ? (VH-bot-cy)/dy : dy<0 ? (top-cy)/dy : Infinity;
  const t=Math.min(tx,ty);
  return [cx+dx*t, cy+dy*t, Math.atan2(dy,dx)];
}
function drawArrow(x,y,a,fill,size){
  const s=size||7, p=Math.sin(tnow()/180)*1.5;
  ctx.save(); ctx.translate(Math.round(x+Math.cos(a)*p),Math.round(y+Math.sin(a)*p)); ctx.rotate(a);
  ctx.beginPath(); ctx.moveTo(s+2,0); ctx.lineTo(-s,-s); ctx.lineTo(-s*0.4,0); ctx.lineTo(-s,s); ctx.closePath();
  ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,.85)'; ctx.stroke(); ctx.fillStyle=fill; ctx.fill();
  ctx.restore();
}
const GUIDE={goal:null, mon:null};
function drawGuides(){
  GUIDE.goal=GUIDE.mon=null;
  if(!playing()||!player||player.fall>0) return;
  const g=currentGoal();
  if(g){
    const sx=g.x-camX, sy=g.y-camY, m=18;
    if(sx<m||sy<m||sx>VW-m||sy>VH-m){
      const [x,y,a]=edgePoint(sx,sy,16); drawArrow(x,y,a,'#ffd66e');
      GUIDE.goal={mode:'edge',x,y,a};
    }else{
      const by=Math.round(sy-26+Math.sin(tnow()/200)*2), bx=Math.round(sx);
      ctx.fillStyle='rgba(0,0,0,.85)'; ctx.beginPath(); ctx.moveTo(bx-6,by-5); ctx.lineTo(bx+6,by-5); ctx.lineTo(bx,by+3); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#ffd66e'; ctx.beginPath(); ctx.moveTo(bx-4,by-4); ctx.lineTo(bx+4,by-4); ctx.lineTo(bx,by+1); ctx.closePath(); ctx.fill();
      GUIDE.goal={mode:'on',x:bx,y:by};
    }
  }
  const M=monster;
  if(M && M.state==='chase'){
    const sx=M.x-camX, sy=M.y-camY;
    if(sx<0||sy<0||sx>VW||sy>VH){
      const [x,y,a]=edgePoint(sx,sy,12), k=0.6+0.4*Math.sin(tnow()/90);
      const gr=ctx.createRadialGradient(x,y,0,x,y,34); gr.addColorStop(0,'rgba(255,40,30,'+(0.45*k).toFixed(2)+')'); gr.addColorStop(1,'rgba(255,40,30,0)');
      ctx.fillStyle=gr; ctx.fillRect(x-34,y-34,68,68);
      drawArrow(x,y,a,'#ff4a3a',8);
      ctx.fillStyle='#fff'; ctx.font='10px Galmuri9'; ctx.textAlign='center';
      ctx.fillText('!', Math.round(x-Math.cos(a)*13), Math.round(y-Math.sin(a)*13+4));
      GUIDE.mon={x,y,a};
    }
  }
}

// ── 상황 힌트: 조건이 처음 맞을 때 한 번씩, 알림·배너가 비어 있을 때만 ──
let toastTip=false, tipQ=[], tipSeen={}, tipLog=[];
function tipReset(){ tipQ=[]; tipSeen={}; tipLog=[]; toastTip=false; }
function tipText(k){
  const kb=WIDE || !('ontouchstart' in window);
  return {
    move:  kb?'WASD·방향키로 이동 · Shift 달리기 — 금색 화살표를 따라가세요':'조이스틱으로 이동 · 끝까지 밀면 달리기 — 금색 화살표를 따라가세요',
    fire:  kb?'석궁 획득! F 키로 쏘면 괴물이 8초 동안 잠든다':'석궁 획득! 석궁 버튼으로 쏘면 괴물이 8초 동안 잠든다',
    plank: kb?'괴물이 쫓아온다! Space로 등 뒤에 목재를 세워 막아라':'괴물이 쫓아온다! 목재 버튼으로 등 뒤를 막아라',
    rescue:kb?'E 키를 꾹 눌러 공주를 구출 — 한 칸마다 괴물이 달려온다':'구출 버튼을 꾹 눌러 공주를 구출 — 한 칸마다 괴물이 달려온다',
    bait:  kb?'Q 키로 미끼를 던지면 괴물이 4초 동안 먹는다':'미끼 버튼으로 던지면 괴물이 4초 동안 먹는다',
    chest: kb?'상자 옆에서 E 키 — 열쇠 조각 4개를 모아라':'상자 옆에서 큰 버튼 — 열쇠 조각 4개를 모아라',
  }[k];
}
function tipWant(k){ if(tipSeen[k]) return; tipSeen[k]=true; tipQ.push(k); }
function tipUpdate(){
  if(!playing()||!player) return;
  if(runTime>1.5) tipWant('move');
  if(player.bow && player.ammo>0) tipWant('fire');
  if(monster.state==='chase' && player.planks>0 && player.bow) tipWant('plank');
  if(!hostage.rescued && Math.hypot(hostage.x-player.x,hostage.y-player.y)<T*3) tipWant('rescue');
  if(stats.planks>0 && monster.state==='chase' && player.bait>0) tipWant('bait');
  if(phase==='key' && chests.some(c=>!c.opened && Math.hypot((c.tx+.5)*T-player.x,(c.ty+.5)*T-player.y)<T*3)) tipWant('chest');   // 닿기 전에 (E를 누른 채 오면 닿는 순간 열리므로)
  const bn=document.getElementById('banner');
  const bannerOn = !!(bn && bn.classList && bn.classList.contains('show'));
  if(tipQ.length && toastLeft<=0 && !bannerOn){
    const k=tipQ.shift(); toastT=tipText(k); toastLeft=3.8; toastTip=true;
    tipLog.push({k, t:runTime, bannerOn});
  }
}

// ════════════════════════════════════════════════════════════
//  루프
// ════════════════════════════════════════════════════════════
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(FX.hitstop>0){ FX.hitstop-=dt; update(0); } else update(dt);
  fxUpdate(dt); musicTick(); tipUpdate(dt); draw(); updateButtons(); idleHome();
  document.getElementById('clock').textContent = playing()? runTime.toFixed(2)+'초' : '';
  const tel=document.getElementById('toast');
  tel.textContent=toastT; tel.style.opacity = toastLeft>0?1:0;
  tel.classList.toggle('tip', toastTip && toastLeft>0);
  requestAnimationFrame(loop);
}
setObj('');
requestAnimationFrame(loop);
</script>
